<style>
/* la typographie d'Astra, direction A (D54) : Cinzel 500 pour les noms, titres, verdicts et rangs (ses minuscules sont des
   petites capitales) ; Inter 400 à 600 pour lire et compter, à l'axe optique 14. Deux fichiers réduits au français par
   tools/polices.py (OFL, notices dans assets/polices) : Inter 72 Ko, Cinzel 32 Ko. */
@font-face { font-family: "Inter"; src: url(assets/polices/inter.woff2) format("woff2"); font-weight: 400 600; font-display: block; }
@font-face { font-family: "Cinzel"; src: url(assets/polices/cinzel.woff2) format("woff2"); font-weight: 500; font-display: block; }
/* les couleurs d'Astra (lot 2, tokens.json) : la nuit, deux panneaux, l'ivoire pour lire, le champagne pour ce qui est acquis
   ou sacré, le cuivre en réserve, le rouge pour le danger — jamais pour un petit texte */
:root {
  --night: #0B121B; --panel: #14202C; --panel-2: #1B2835;
  --ink: #F0EADC; --soft: #A8B3BF; --faint: #758391; --line: #33424E; --line-2: #45525F;
  --gold: #C8B88C; --gold-soft: #8B7954; --gold-dim: rgba(200, 184, 140, .16); --gold-fill: #252820;
  --ivory: #F0EADC; --copper: #B98B74; --danger: #964E49; --danger-ink: #B86F67;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  --title: "Cinzel", Georgia, serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); /* zones sûres iOS ; ?safe=1 les simule hors appareil */
  --card-w: 200px; /* recalculée en JS d'après l'espace réel du puits (Safari avec barre, plein écran, consigne affichée) */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  margin: 0; height: 100%; color: var(--ink);
  background: var(--night);
  font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: none; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } /* lu, pas vu */
#sr { position: fixed; top: 0; left: 0; margin: 0; } /* la voix de VoiceOver : hors du flux, sinon sa marge allonge la page */
button:active { opacity: .6; }
#app {
  height: 100%; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px;
  padding: calc(var(--sat) + 8px) 12px 0; /* 8 px : la cible de 44 pt du menu (marge −8 px) affleure le bord sans le dépasser */
  background: radial-gradient(120% 70% at 50% 28%, #111B26 0%, var(--night) 62%);
}

/* ---- barre du haut (D45) : la progression à gauche, un vrai bouton Menu à droite ; plus de titre, le nom est à l'accueil.
   Pendant la préparation, « ‹ Accueil » prend la place de la progression. */
#head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 14px; min-height: 44px; }
#prog { display: flex; align-items: center; gap: 10px; min-width: 0; }
#level { flex: none; font: 400 .8125rem var(--sans); letter-spacing: .02em; color: var(--gold); }
#xp { flex: 1; max-width: 140px; height: 2px; background: var(--line); border-radius: 1px; }
#xp i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .6s ease; }
#menu, #back { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel);
  font: 400 .9375rem var(--sans); color: var(--ink); }
#back { justify-self: start; }
#back[hidden], #prog[hidden] { display: none; }
/* ---- la Veillée pendant la nuit (D50) : trois lunes, la nuit et sa cible, et la constellation de la cible que les points
   de la nuit tracent ; elle devient d'or à la cible, et vacille quand tout pourrait tomber */
#vstrip { display: grid; gap: 3px; min-width: 0; }
#vstrip[hidden] { display: none; }
.vs-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.moons { display: inline-flex; gap: 4px; flex: none; }
/* les quatre lunes d'Astra (lot V, D58) : à venir (un cercle), en cours (un demi-disque), tenue (un disque), manquée (un cercle rompu, barré) —
   distinctes sans la couleur ; la manquée seule prend le rouge */
.moon { width: 16px; height: 16px; color: var(--faint); }
.moon.half, .moon.full { color: var(--gold); }
.moon.lost { color: var(--danger-ink); }
.vs-label { font: 400 .8125rem/1.15 var(--sans); color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vs-label b { color: var(--ink); font-weight: 500; }
.vs-label em { font-style: normal; color: var(--ivory); }
.vs-score { margin-left: auto; font: 600 1.0625rem/1 var(--sans); color: var(--ivory); font-variant-numeric: tabular-nums; }
.vs-score.ok { color: var(--gold); }
.vs-gauge { display: block; flex: 1; min-width: 0; max-width: 220px; height: 14px; overflow: visible; }
/* la constellation de la cible (lot V) : sept étoiles, six liaisons ; l'étoile i s'allume à i/7 de la cible, la liaison i quand l'étoile i+1 l'est ;
   à la cible, tout s'allume ensemble et un halo se dilate et s'éteint en 300 ms */
.vs-gauge path { fill: none; stroke: var(--line); stroke-width: 1; transition: stroke .25s ease-out; }
.vs-gauge path.on { stroke: var(--gold); }
.vs-bot { display: flex; align-items: center; gap: 8px; min-width: 0; }
.vs-offer { flex: none; font: 400 .8125rem/1 var(--sans); font-style: normal; color: var(--gold); white-space: nowrap; }
.vs-offer:empty { display: none; }
.vs-gauge circle { fill: var(--faint); transition: fill .25s ease-out; }
.vs-gauge circle.on { fill: var(--gold); }
.vs-gauge.halo { animation: cibleHalo .3s ease-out; }
@keyframes cibleHalo { 0% { filter: drop-shadow(0 0 0 rgba(200, 184, 140, 0)); } 40% { filter: drop-shadow(0 0 5px rgba(200, 184, 140, .9)); } 100% { filter: drop-shadow(0 0 0 rgba(200, 184, 140, 0)); } }
.vs-gauge.shiver { animation: shiver 1.2s ease-in-out infinite; }
@keyframes shiver { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
/* ---- entre deux nuits : le résultat, la cible suivante, trois Offrandes, et la porte de sortie */
#app.inter { grid-template-rows: auto 1fr; }
#app.inter #rail, #app.inter #stage, #app.inter #tray, #app.inter #vestibule { display: none; }
#interlude { display: grid; align-content: start; justify-items: center; gap: 12px; min-height: 0; overflow-y: auto; touch-action: pan-y; padding: 6px 2px calc(var(--sab) + 16px); }
#interlude[hidden] { display: none; }
#interlude .i-kicker .moon { width: 20px; height: 20px; }
#interlude h2 { margin: 2px 0 0; font: 500 1.375rem/1.15 var(--title); letter-spacing: .06em; color: var(--ivory); text-align: center; }
#interlude .i-sub { margin: 0; color: var(--soft); font-size: .9375rem; line-height: 1.4; text-align: center; max-width: 34ch; }
#interlude .i-sub b { color: var(--gold); font-weight: 500; }
.offers { display: grid; gap: 10px; width: min(100%, 360px); }
/* le cartouche d'une Offrande (lot V) : un contour aux angles coupés, l'emblème de sa famille, son nom, la phrase (deux lignes) ; posé, il prend la
   couleur de sa famille — contour renforcé, un losange plein à droite, une barre à gauche —, jamais la couleur seule */
.offer { --acc: var(--gold); --frame: #758391; --cut: 13px; position: relative; display: block; width: 100%; min-height: 62px; padding: 1px; border: 0; background: var(--frame); color: var(--ivory); text-align: left; font: 400 .9375rem/1.3 var(--sans);
  clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
.offer.f-paquet { --acc: #8BA7C4; } .offer.f-cible { --acc: #C8B88C; } .offer.f-gardiens { --acc: #B98B74; } .offer.f-regle { --acc: #90B5A6; }
.offer .in { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) 22px; column-gap: 12px; align-items: center; min-height: 60px; padding: 7px 8px 7px 15px; background: var(--panel);
  clip-path: polygon(calc(var(--cut) - .42px) 0, calc(100% - var(--cut) + .42px) 0, 100% calc(var(--cut) - .42px), 100% calc(100% - var(--cut) + .42px), calc(100% - var(--cut) + .42px) 100%, calc(var(--cut) - .42px) 100%, 0 calc(100% - var(--cut) + .42px), 0 calc(var(--cut) - .42px)); }
.offer .fam { display: block; width: 28px; height: 28px; color: var(--acc); }
.offer .tx { display: grid; gap: 2px; min-width: 0; }
.offer b { font: 500 .6875rem/1.1 var(--sans); letter-spacing: .065em; text-transform: uppercase; color: var(--acc); }
.offer .tx > span { font-size: .875rem; line-height: 1.28; }
.offer .pick { position: relative; width: 22px; height: 22px; }
.offer.sel { --frame: var(--acc); padding: 1.5px; }
.offer.sel .in { background: #1B2934; }
.offer.sel .pick::before { content: ""; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; background: var(--acc); transform: rotate(45deg); }
.offer.sel .in::after { content: ""; position: absolute; left: 6px; top: 22%; bottom: 22%; width: 2px; border-radius: 1px; background: var(--acc); }
.picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(100%, 360px); }
.picker p { width: 100%; margin: 0; text-align: center; color: var(--soft); font-size: .86rem; }
.picker button { min-width: 44px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); color: var(--ink); font: 600 .8125rem var(--sans); letter-spacing: .02em; }
.picker button[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }
.offer i { font-style: normal; color: var(--acc); white-space: nowrap; }
.i-kicker { margin: 0; display: flex; align-items: center; gap: 10px; font: 400 .8125rem var(--sans); color: var(--soft); }
.picker.four { display: grid; grid-template-columns: repeat(4, minmax(44px, 1fr)); }
.picker.four p { grid-column: 1 / -1; }
/* petit écran : les familles s'effacent, les huit symboles tiennent sans légende ; « Commencer » dit ce qu'il attend */
@media (max-height: 620px) { #interlude { gap: 9px; } #interlude h2 { font-size: 1.15rem; } .offer { min-height: 56px; } .offer .in { min-height: 54px; padding-top: 4px; padding-bottom: 4px; } .offer .tx > span { font-size: .8125rem; line-height: 1.2; } .picker.four p { display: none; } .i-primary { min-height: 50px; } }
.i-primary[disabled] { opacity: .45; border-color: var(--line-2); color: var(--soft); background: none; }
.i-primary { min-height: 52px; padding: 0 28px; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-fill); color: var(--gold); font: 600 .9375rem var(--sans); }
.i-quiet { min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--soft); font: 400 .8125rem var(--sans);
  text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 5px; }

/* ---- rail : les 8 symboles ; sous chacun, une pastille par carte encore dans le paquet (rouges quand elles tuent) */
#rail { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.sym { border: 1px solid var(--line); border-radius: 6px; padding: 6px 5px 6px; text-align: center; line-height: 1.1; transition: background .2s, border-color .2s; }
.sym b { display: block; font: 600 .8125rem var(--sans); letter-spacing: .02em; }
.sym .pips { display: flex; gap: 2px; height: 3px; margin-top: 6px; }
.sym .pips s { flex: 1; border-radius: 1px; background: var(--soft); text-decoration: none; }
.sym .pips s.gone { background: var(--line); }
.sym.taken { background: var(--gold); border-color: var(--gold); color: #15202A; } /* pris partout : chaque carte restante tue */
.sym.taken .pips s { background: #8E1B10; }
.sym.taken .pips s.gone { background: rgba(26, 20, 8, .22); }
/* pris d'un seul côté : la moitié correspondante s'allume — l'autre côté reste ouvert, et fait la paire */
.sym.half-l, .sym.half-r { border-color: var(--gold-soft); }
.sym.half-l { background: linear-gradient(90deg, var(--gold-dim) 50%, transparent 50%); }
.sym.half-r { background: linear-gradient(270deg, var(--gold-dim) 50%, transparent 50%); }
.sym.half-l b, .sym.half-r b { color: var(--gold); }
.sym.flash { background: #A8392C; border-color: #A8392C; color: #fff; } /* rouge assez profond pour que le blanc passe 6,4:1 */
.sym.flash .pips s { background: rgba(255, 255, 255, .92); }
.sym.flash .pips s.gone { background: rgba(255, 255, 255, .25); }

/* ---- scène : les deux autels tiennent les côtés (on pose à gauche et à droite, on le voit), la carte est
   au centre, la défausse est en bas (on passe vers le bas, la carte y tombe). Les quatre axes deviennent
   quatre destinations visibles. La fin de nuit se pose par-dessus. */
#stage { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; column-gap: 8px; row-gap: 4px; align-items: stretch; min-height: 0; }
#consigne { grid-column: 1 / -1; grid-row: 1; max-width: 32ch; margin: 0 auto; text-align: center; color: var(--ivory); font-size: .92rem; line-height: 1.32; min-height: 2.6em; display: grid; align-items: center; }
#consigne[hidden] { display: none; }
#well { grid-column: 2; grid-row: 2; position: relative; display: grid; place-items: center; min-height: 0; }
#aid { grid-column: 1 / -1; grid-row: 3; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding-bottom: 4px; }
#aid[hidden] { display: none; }

.cue { position: absolute; margin: 0; font: 400 .8125rem var(--sans); letter-spacing: .02em; color: var(--soft); opacity: .8; transition: color .15s, opacity .15s; pointer-events: none; white-space: nowrap; }
.cue.on { color: var(--gold); opacity: 1; }
.cue.up { top: 2px; left: 50%; transform: translateX(-50%); }
.cue.down { bottom: 2px; left: 50%; transform: translateX(-50%); }
/* « Poser » se tient au milieu de la gouttière, entre les paliers de l'autel (ils finissent ≈ 10 px dans le puits)
   et le bord de la carte : collé au bord du puits, il tombait sur le ×2, toujours à mi-hauteur. −1,5 px = 5 − 6,5,
   la demi-largeur du repère ; fitBoard garantit la place (voir la largeur de carte). */
.cue.left { left: calc(25% - var(--card-w) / 4 - 1.5px); top: 50%; writing-mode: vertical-rl; transform: translateY(-50%) rotate(180deg); }
.cue.right { right: calc(25% - var(--card-w) / 4 - 1.5px); top: 50%; writing-mode: vertical-rl; transform: translateY(-50%); }
.cue[hidden] { display: none; }

#card { position: relative; width: var(--card-w); aspect-ratio: 2 / 3; will-change: transform; transition: width .2s; border-radius: calc(var(--card-w) * .05714); }
#card:focus { outline: none; }
#card:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 5px; } /* au clavier seulement : le doigt ne l'allume jamais */
#card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 340ms cubic-bezier(.2, .7, .2, 1); }
#card.up .inner { transform: rotateY(180deg); }
/* la carte d'Astra (direction A, « le Portique de nuit », D52) : un dos unique et un cadre de face en PNG 720 × 1080 ; le
   fond ivoire, le symbole et les valeurs sont posés par le code aux coordonnées de placement.json, dans le même repère.
   Coins : 41,143 px sur 720. Sans les images (hors ligne), la carte reste une carte : fond de nuit, fond ivoire. */
.face { position: absolute; inset: 0; border-radius: calc(var(--card-w) * .05714); } /* pas de backface-visibility : la bascule de visibilité ci-dessous suffit et rend pareil partout */
.face.back { background: #0B121B url(assets/cartes/dos.png) center / 100% 100% no-repeat; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); }
/* le danger se lit sur le dos, avant de retourner (panel du 28 septembre) : il s'embrase quand des cartes restantes ne se
   poseraient nulle part — ambré s'il reste des passes (elle coûterait une passe), rouge sinon (tout tomberait) */
.face.back .risk { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: var(--risk, 0); transition: opacity .35s;
  background: url(assets/cartes/danger-ambre.png) center / 100% 100% no-repeat; /* le filet d'Astra (D57) ; sous lui le halo, dosé ici */
  box-shadow: inset 0 0 34px 3px rgba(200, 184, 140, .24); }
#card.fall .face.back .risk { background-image: url(assets/cartes/danger-rouge.png); box-shadow: inset 0 0 40px 4px rgba(150, 78, 73, .5); }
/* Nanna : la carte vue reste écrite sur le dos tant qu'on ne l'a pas retournée */
.face.back .seen { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); padding: 5px 9px; border-radius: 6px; background: rgba(11, 18, 27, .9);
  white-space: nowrap; font: 500 .6875rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.face.front { color: #15202A; transform: rotateY(180deg); background: #F0EADC url(assets/cartes/face-cadre.png) center / 100% 100% no-repeat;
  box-shadow: 0 14px 34px rgba(0, 0, 0, .5); }
.face.front svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.face.front .val, .face.front .corner { font-family: var(--sans); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; fill: currentColor; }
.face.front .name { font-family: var(--sans); font-weight: 500; letter-spacing: .16em; fill: currentColor; }
.face.front .name .rest { opacity: .55; } /* les deux premières lettres sont le code du rail et des autels */
.face.front, #card.up .face.back { visibility: hidden; transition: visibility 0s 170ms; } /* les faces s'échangent à mi-retournement */
#card.up .face.front { visibility: visible; }
#card.snap .inner, #card.snap .face { transition: none !important; } /* nouvelle carte : pas de retournement, donc pas de délai */
/* anneau de maintien (réglage) : se remplit en 600 ms, puis garde */
#card.ring::before { content: ""; position: absolute; inset: -10px; border-radius: 22px; background: conic-gradient(var(--gold) var(--ring, 0deg), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }

#aid button, #sheet button { min-height: 44px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 16px; font: 400 .9375rem var(--sans); color: var(--ink); }
#aid button:disabled { opacity: .3; }

/* ---- autel : une colonne par côté, qui se remplit du bas vers le haut ; le palier est écrit sur la place
   qui le déclenche (4, 6, 8). L'autel du Crépuscule existe dès le niveau 1, verrouillé : on voit ce qu'on gagnera. */
/* les cadres d'autel d'Astra (lot 6, D57) : la niche en arche en tête (champagne à l'Aube, cuivre au Crépuscule, l'arche tournée dans
   l'autre sens), deux montants le long des huit places, le socle sous elles — le total et son multiplicateur y reposent */
.altar { --frame: var(--gold); grid-row: 2; align-self: center; display: flex; flex-direction: column; gap: 6px; width: var(--altar-w, 58px); }
.altar[data-altar="1"] { --frame: var(--copper); }
.altar[data-altar="0"] { grid-column: 1; }
.altar[data-altar="1"], #altar-locked { grid-column: 3; }
.stars { position: relative; display: flex; flex-direction: column-reverse; gap: var(--slot-gap, 3px); padding: 0 5px; } /* la première place est en bas : l'autel monte */
.stars::before, .stars::after { content: ""; position: absolute; top: 0; bottom: 0; width: 0; border-left: .75px solid var(--frame); opacity: .8; }
.stars::before { left: 2px; } .stars::after { right: 2px; }
.star { position: relative; z-index: 0; height: var(--slot-h, 30px); border-radius: 5px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; line-height: 1; transition: transform .25s, opacity .25s; }
.star.on { border: 1px solid var(--line-2); background: var(--panel); }
.star.on b { font: 500 calc(.6875rem * var(--slot-k, 1))/1 var(--sans); letter-spacing: .02em; color: var(--soft); }
.star.on i { font: 600 calc(1rem * var(--slot-k, 1))/1 var(--sans); font-style: normal; font-variant-numeric: tabular-nums; }
.star.big { border-color: var(--gold-soft); background: var(--panel-2); } /* les trois plus fortes : plus marquées */
.star.big i { font-size: calc(1.15rem * var(--slot-k, 1)); color: var(--ivory); }
/* une paire : le même symbole des deux côtés, les deux étoiles doublent */
.star.pair { border-color: var(--gold); background: var(--gold-dim); }
.star.pair i { color: var(--gold); }
.star.pair::before { content: ""; position: absolute; top: 50%; width: 7px; height: 1px; background: var(--gold); opacity: .7; }
.altar[data-altar="0"] .star.pair::before { left: 100%; }
.altar[data-altar="1"] .star.pair::before { right: 100%; }
.star.fallen { opacity: .18; transform: translateX(-6px); }
/* le palier : un vrai élément (et non un ::after) pour que les tests mesurent qu'aucun repère ne le chevauche */
.mark { position: absolute; top: 50%; transform: translateY(-50%); font: 400 .75rem/1 var(--sans); color: var(--faint); transition: color .3s; pointer-events: none; }
.altar[data-altar="0"] .mark { left: calc(100% + 10px); }
.altar[data-altar="1"] .mark { right: calc(100% + 10px); }
.mark.reached { color: var(--gold-soft); }
.mark.current { color: var(--gold); }
#stage.over .mark { visibility: hidden; } /* nuit finie : les paliers ne servent plus, et le panneau de fin les couvrirait à moitié */
.tally { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px; border-top: .75px solid var(--frame); }
.tally .sum { font: 600 1.5rem/1 var(--sans); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tally .mult { font: 500 .75rem/1 var(--sans); padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--soft); transition: color .3s, border-color .3s, background .3s; }
.tally .mult.up { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); } /* multiplicateur en cours, mis en valeur dès ×2 */
.altar.ruin .sum { color: var(--danger-ink); }
/* l'autel à venir : la place est tenue, le niveau qui l'ouvre est écrit dessus */
#altar-locked { grid-row: 2; align-self: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
  width: var(--altar-w, 58px); height: var(--altar-h, 280px); border: 1px dashed var(--line); border-radius: 8px; color: var(--soft); padding: 10px 2px; }
#altar-locked[hidden] { display: none; }
#altar-locked b { writing-mode: vertical-rl; font: 500 .6875rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
#altar-locked span { font: 500 .6875rem/1.2 var(--sans); letter-spacing: .04em; text-align: center; }
#altar-locked.deny { animation: denyPulse .5s ease-out; }
@keyframes denyPulse { 0% { border-color: var(--line); } 35% { border-color: var(--gold); color: var(--gold); } 100% { border-color: var(--line); } }

/* ---- défausse : ce que coûtent les passes, en bas, là où le geste envoie la carte */
#tray { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  margin: 0 -12px; padding: 8px 18px calc(var(--sab) + 8px); border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(20, 32, 44, .9), #0B121B); }
#tray .bloc { display: flex; flex-direction: column; align-items: center; gap: 5px; }
#tray .label { font: 400 .8125rem/1 var(--sans); color: var(--soft); }
#passes { display: flex; gap: 7px; height: 30px; align-items: center; }
#passes span { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--soft); transition: background .3s, border-color .3s, opacity .3s; }
#passes span.on { background: var(--soft); }
#passes span.off { border-color: var(--faint); opacity: .5; }
#discard { position: relative; width: 44px; height: 30px; border-radius: 5px; border: 1px dashed var(--line); display: grid; place-items: center;
  font: 600 .8125rem/1 var(--sans); color: var(--soft); }
#discard.has { border-style: solid; border-color: var(--line-2); background: var(--panel); color: var(--soft); }

/* ---- fin de nuit */
/* sans fond : la carte est déjà partie quand ce panneau paraît, il n'a rien à cacher (un fond opaque dessinait un
   rectangle sombre entre les deux colonnes, un halo laissait un contour à sa lisière) */
#end { grid-column: 2; grid-row: 1 / -1; z-index: 3; display: grid; place-content: center; gap: 10px; padding: 0 6px; text-align: center; cursor: pointer; }
#end[hidden] { display: none; }
#end .kicker { font: 500 1.0625rem/1.2 var(--title); letter-spacing: .08em; color: var(--ink); }
/* la chute : le verdict en ivoire, un losange rouge au-dessus (Astra : jamais de petit texte rouge) */
#end.bust .kicker { font: 400 1.0625rem/1.4 var(--sans); letter-spacing: 0; }
#end.bust .kicker::before { content: ""; display: block; width: 9px; height: 9px; margin: 0 auto 12px; background: var(--danger); box-shadow: 0 0 0 1px var(--danger-ink); transform: rotate(45deg); }
#end .score { font: 600 4.5rem/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
#end .sub { color: var(--soft); }
#end .sub b { color: var(--gold); font-weight: 500; }
#end .gods { color: var(--gold); font: 500 1.0625rem var(--sans); }
#end .gods small { margin-left: 8px; font: 400 .8125rem var(--sans); color: var(--soft); }
#end .gain { margin: -2px auto 0; max-width: 32ch; color: var(--ivory); font-size: .9375rem; line-height: 1.4; } /* ce que le rang nouveau apporte (D48) */
/* la nuit d'une Veillée (D50) : sa cible atteinte ou non ; à la fin, le bilan de la Veillée */
#end .vline { max-width: 30ch; margin: 0 auto; font-size: .9375rem; line-height: 1.4; color: var(--soft); }
#end .vline b { color: var(--gold); font-weight: 500; }
#end .vline.ko b { color: var(--ink); }
.vsum { display: grid; gap: 6px; justify-items: center; font-size: .9375rem; line-height: 1.4; color: var(--soft); text-align: center; max-width: 34ch; }
.dsum { display: grid; gap: 6px; justify-items: center; text-align: center; max-width: 34ch; color: var(--soft); font-size: .9375rem; line-height: 1.4; }
.dsum .pico { width: 32px; height: 32px; color: var(--gold); }
.dsum .dscore { margin: 2px 0; font: 600 4rem/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ivory); }
.dsum .verdict b { color: var(--gold); font-weight: 500; }
.dsum .guards { color: var(--ivory); }
.dsum .when { font: 400 .8125rem var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.i-share { min-height: 48px; padding: 0 24px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--panel); color: var(--ink); font: 400 .9375rem var(--sans); }
.vsum .moons .moon { width: 30px; height: 30px; }
.vsum .moons { gap: 8px; margin: 4px 0 2px; }
.vsum .prime { font: 500 1.375rem var(--sans); color: var(--gold); }
.vsum .open { color: var(--gold); }
.v-nights { display: grid; gap: 4px; margin: 4px 0 6px; padding: 0; list-style: none; width: min(100%, 260px); }
.v-nights li { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.v-nights li span:first-child { text-align: left; font: 500 .6875rem var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.v-nights li span:last-child { text-align: right; }
.v-nights li b { font: 600 1.375rem var(--sans); color: var(--ivory); font-variant-numeric: tabular-nums; }
.v-nights li.ko b { color: var(--soft); text-decoration: line-through; text-decoration-color: var(--danger-ink); }
#end .graze, #end .fait { font-size: .875rem; color: var(--soft); }
#end .graze b, #end .fait b { color: var(--gold); font-weight: 500; }
#end .again { justify-self: center; margin-top: 22px; min-height: 48px; min-width: 150px; padding: 0 26px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-fill); font: 600 .9375rem var(--sans); color: var(--gold); }
/* déblocage : le moment de la progression, encadré, jamais une ligne perdue */
#end .unlock { margin: 14px auto 0; padding: 12px 16px; max-width: 30ch; border: 1px solid var(--gold-soft); border-radius: 10px; background: var(--gold-dim); }
/* petit écran : la fin la plus chargée (un dieu renforcé, ce que son pouvoir devient, un palier) tient entre le rail et
   les passes — le panneau, centré, débordait des deux côtés */
@media (max-height: 620px) {
  #end { gap: 5px; }
  #end .kicker, #end .gods, #end .unlock em { font-size: .9375rem; }
  #end .score { font-size: 3rem; }
  #end .gain { font-size: .875rem; line-height: 1.35; }
  #end .again { margin-top: 8px; min-height: 44px; }
  #end .unlock { margin-top: 4px; padding: 7px 12px; }
}
#end .unlock em { display: block; font: 500 1.0625rem var(--title); font-style: normal; letter-spacing: .06em; color: var(--gold); margin-bottom: 5px; }
@media (max-height: 620px) { #end .unlock em { font-size: .9375rem; margin-bottom: 3px; } }
#end .unlock span { color: var(--ivory); font-size: .9375rem; }

/* ---- Patron sur son autel : sa figure en tête de colonne ; elle s'allume quand le pouvoir agit */
/* la plaque du Gardien : son médaillon d'Astra (D55), sans boîte — l'arche est déjà son cadre, et le rang s'y lit en filets */
.plate { position: relative; height: 54px; width: 100%; border: 0; border-radius: 8px; background: none; padding: 0; color: var(--gold); }
.plate .niche { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; color: var(--frame); fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: .75; }
.plate .niche polygon { fill: currentColor; stroke-width: .8; }
.plate.none { visibility: hidden; } /* l'autre autel garde la même hauteur : les places restent alignées */
.plate .mdl { position: absolute; top: 5px; left: 50%; width: 40px; height: 40px; margin-left: -20px; overflow: visible; }
.plate.used { opacity: .45; } /* Nanna : la vision de la nuit est prise */
.plate.glow .mdl { animation: plateGlow .6s ease-out; }
.plate:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; }
@keyframes plateGlow { 0% { filter: drop-shadow(0 0 0 rgba(200, 184, 140, 0)); } 30% { filter: drop-shadow(0 0 6px rgba(200, 184, 140, .95)) brightness(1.3); } 100% { filter: drop-shadow(0 0 0 rgba(200, 184, 140, 0)); } }
button.plate:disabled { cursor: default; }
/* une étoile que le Patron de son autel fait valoir plus : un point d'or, et la valeur réelle */
.star.boost::after { content: ""; position: absolute; top: 4px; right: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
.tally { position: relative; }
.tally .bonus { position: absolute; right: 0; top: -7px; padding: 0 2px; background: var(--night); font: 600 .75rem/1 var(--sans); color: var(--gold); }
/* rail : pris partout mais un Patron la défausserait — les pastilles ne sont pas rouges, elles ne tuent pas */
.sym.taken.guarded .pips s { background: #6E6246; }
/* la vision de Nanna : la carte se soulève et montre sa face, sans être retournée */
#card.peek { transform: translateY(-12px) rotate(-2deg); transition: transform .2s; }
#card.peek .inner { transform: rotateY(180deg); }
#card.peek .face.front { visibility: visible; }
#card.peek .face.back { visibility: hidden; }

/* ---- accueil (D44) : le nom, ton ciel, ta progression, Jouer ; le panthéon et le Défi du jour en bas */
#app.home { grid-template-rows: 1fr; }
#app.home #head, #app.home #rail, #app.home #stage, #app.home #tray, #app.home #vestibule { display: none; }
#home { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); justify-items: center; gap: 16px; min-height: 0;
  padding-bottom: calc(var(--sab) + 18px); }
#home[hidden] { display: none; }
#home-sky { position: absolute; inset: 0 -12px auto; width: calc(100% + 24px); height: 62%; pointer-events: none; }
#home-settings { position: relative; justify-self: end; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--soft); }
/* le logotype d'Astra (lot 7) : Cinzel vectorisé, jamais recomposé ; le mot reste lisible au lecteur d'écran */
#logo { position: relative; align-self: center; margin: 0; line-height: 0; color: var(--ivory); }
#logo svg { display: block; width: min(51vw, 200px); height: auto; } /* boîte recadrée sur les lettres : le mot fait 200 pt, comme sur la maquette */
.h-prog { position: relative; display: grid; justify-items: center; gap: 8px; width: min(78%, 280px); }
#h-level { font: 400 .9375rem var(--sans); letter-spacing: .02em; color: var(--gold); }
.h-xp { width: 100%; height: 2px; background: var(--line); border-radius: 1px; }
.h-xp i { display: block; height: 100%; width: 0; background: var(--gold); }
#h-next { margin: 0; text-align: center; color: var(--soft); font-size: .9375rem; line-height: 1.35; }
#h-next b { color: var(--ivory); font-weight: 500; }
#home-play { position: relative; min-width: 186px; min-height: 52px; padding: 0 30px; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-fill); color: var(--gold);
  font: 600 1.0625rem var(--sans); }
/* la Veillée à l'accueil (D50) : son numéro, sa durée, les Veillées tenues ; la Grande quand on en a tenu une */
#h-veillee { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; }
#h-veillee[hidden] { display: none; }
#h-veillee b { font: 500 1.0625rem var(--title); letter-spacing: .08em; color: var(--gold); }
#h-veillee span { font-size: .9375rem; color: var(--soft); line-height: 1.35; max-width: 34ch; }
#h-veillee .first { color: var(--ivory); }
#h-veillee .moons { vertical-align: -2px; margin-right: 4px; }
#h-kind { position: relative; display: inline-flex; }
#h-kind[hidden] { display: none; }
#h-kind button { min-height: 44px; padding: 0 18px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); color: var(--ink); font: 400 .9375rem var(--sans); }
#h-kind button[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-fill); color: var(--gold); }
#home-free { position: relative; min-height: 44px; padding: 0 16px; border: 0; background: none; color: var(--soft); font: 400 .9375rem var(--sans);
  text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 5px; }
#home-free[hidden] { display: none; }
@media (max-height: 620px) { #home { gap: 10px; } #home-play { min-height: 48px; } }
.h-links { position: relative; display: flex; gap: 12px; align-items: stretch; }
.h-links button, .h-links .soon { min-height: 44px; min-width: 150px; padding: 6px 16px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel);
  display: grid; place-content: center; font: 400 .9375rem var(--sans); color: var(--ink); text-align: center; }
.h-links .soon { border-style: dashed; background: none; color: var(--soft); font-size: .8125rem; line-height: 1.25; }
.h-links .soon small { display: block; font: 400 .8125rem var(--sans); color: var(--soft); }
.h-links button[hidden], .h-links .soon[hidden] { display: none; }
/* le Défi du jour (SPEC §10) : le calendrier d'Astra, le nom, et une ligne — les deux Gardiens du jour, « Reprendre », ou le score */
.h-links .defi { grid-template-columns: auto auto; column-gap: 10px; place-content: center; align-items: center; justify-items: start; text-align: left; line-height: 1.2; }
.h-links .defi .pico { width: 24px; height: 24px; grid-row: 1 / span 2; color: var(--gold); }
.h-links .defi small { font: 400 .75rem var(--sans); color: var(--soft); }
.h-links .defi.done small { color: var(--gold); }
/* la bulle d'un Gardien (D46) : on la demande en touchant sa plaque ; le jeu n'impose jamais de texte */
#tip { position: fixed; z-index: 15; left: 0; top: 0; max-width: min(280px, calc(100vw - 24px)); padding: 12px 14px; border: 1px solid var(--gold-soft); border-radius: 12px;
  background: var(--panel); box-shadow: 0 12px 30px rgba(0, 0, 0, .5); color: var(--ivory); font-size: .9375rem; line-height: 1.4; }
#tip[hidden] { display: none; }
#tip .pico, #godcard .pico { display: block; width: 24px; height: 24px; flex: none; }
#tip b { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font: 500 .9375rem var(--title); letter-spacing: .06em; color: var(--gold); }
#tip button { margin-top: 10px; min-height: 44px; padding: 0 18px; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-fill); color: var(--gold);
  font: 600 .9375rem var(--sans); }

/* ---- vestibule : on y pose ses Gardiens avant la nuit ; Rejouer n'y repasse pas (D42) */
#app.vest { grid-template-rows: auto 1fr; }
#app.vest #rail, #app.vest #stage, #app.vest #tray { display: none; }
#vestibule { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; min-height: 0; padding-bottom: calc(var(--sab) + 12px); }
#vestibule[hidden] { display: none; }
.v-board { display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; column-gap: 8px; min-height: 0; }
.v-altar { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.v-niche { position: relative; min-height: 84px; border: 1px dashed var(--line-2); border-radius: 12px; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 2px; color: var(--soft); font: 400 .6875rem/1.1 var(--sans); }
.v-niche .empty { width: 34px; height: 34px; border-radius: 50%; border: 1px dashed var(--line-2); }
.v-niche .mdl { display: block; width: 46px; height: 46px; overflow: visible; }
.v-niche.filled { border-style: solid; border-color: var(--gold-soft); background: var(--gold-dim); color: var(--gold); }
.v-niche.target, .v-niche.filled.sel { border-color: var(--gold); border-style: solid; }
.v-slot { position: relative; display: grid; }
/* retirer un Gardien : une croix sur le bord intérieur de la niche, 44 pt de cible (toucher la niche lit son pouvoir) */
.v-remove { position: absolute; top: -17px; z-index: 1; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--soft); font: 400 1.05rem/1 var(--sans); display: grid; place-items: center; }
.v-remove::before { content: ""; position: absolute; left: 9px; top: 9px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); z-index: -1; }
.v-altar[data-altar="0"] .v-remove { right: -17px; }
.v-altar[data-altar="1"] .v-remove { left: -17px; }
.v-niche.deny { animation: denyPulse .5s ease-out; }
.v-column { flex: 1; min-height: 60px; border: 1px dashed var(--line); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.v-column b { writing-mode: vertical-rl; font: 500 .6875rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
.v-column span { font: 500 .6875rem/1.2 var(--sans); letter-spacing: .04em; text-align: center; color: var(--soft); }
.v-center { display: grid; place-content: center; justify-items: center; gap: 12px; }
#v-line { margin: 0; display: grid; gap: 3px; text-align: center; }
#v-line[hidden] { display: none; }
#v-line b { font: 500 1.0625rem var(--title); letter-spacing: .08em; color: var(--gold); }
#v-line span { font-size: .9375rem; color: var(--soft); }
#play { max-width: 100%; min-height: 52px; padding: 0 22px; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-fill); color: var(--gold); font: 600 1.0625rem var(--sans); } /* « Commencer » tient entre les deux niches, jusqu'au petit écran */
.v-shelf { border-top: 1px solid var(--line); padding-top: 12px; }
/* cinq médaillons par rangée, deux rangées visibles ; au-delà, on fait défiler, et un fondu le dit */
#vgods { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 6px; max-height: 184px; padding-top: 6px; overflow-y: auto; touch-action: pan-y; } /* 6 px : le second filet d'un rang II ou III n'est pas rogné */
#vgods.more { -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent); mask-image: linear-gradient(180deg, #000 78%, transparent); }
.medal { width: 64px; min-height: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: none; touch-action: none; color: var(--ivory); }
.medal .disc { width: 52px; height: 52px; display: grid; place-items: center; color: var(--gold); transition: filter .2s, color .2s; }
.medal .disc .mdl { display: block; width: 52px; height: 52px; overflow: visible; }
.medal .who { font: 400 .75rem/1.15 var(--sans); text-align: center; white-space: nowrap; }
.medal .who small { display: block; font: 500 .75rem var(--title); letter-spacing: .06em; color: var(--soft); }
.medal.sel .disc { color: var(--ivory); filter: drop-shadow(0 0 5px rgba(200, 184, 140, .7)); }
.medal.placed .disc { opacity: .45; }
/* le rang d'un dieu (D48) : le cerclage s'épaissit — un filet au rang I, deux au rang II, deux et un halo au rang III (et
   au-delà : IV et V ne changent que le chiffre). Sur le médaillon, la niche et la plaque de la nuit. */
#vcaption { margin: 10px auto 0; max-width: 34ch; min-height: 2.8em; text-align: center; color: var(--soft); font-size: .875rem; line-height: 1.35; }
#vcaption b { color: var(--gold); font-weight: 500; }
#ghost { position: fixed; z-index: 30; left: 0; top: 0; pointer-events: none; }
#ghost[hidden] { display: none; }
/* le vestibule, à un geste : en retrait de Rejouer, qui reste l'action de la fin de nuit (D42) ; cible de 44 pt */
#end .alt { min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; background: none; justify-self: center; font: 400 .9375rem var(--sans); color: var(--soft); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 5px; }
#end .saved { color: var(--ivory); }

/* ---- théophanie : le dieu nommé, plein écran, avant le décompte */
#theo { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 18px; background: #070D14; }
#theo[hidden] { display: none; }
/* les trois calques d'un portrait d'Astra (D55), superposés à la même origine : le fond de nuit, la figure détourée, le pictogramme d'or */
.pl { position: relative; overflow: hidden; background: #0B121B; }
.pl img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#theo .tplate { position: relative; width: min(62vw, 260px); aspect-ratio: 2 / 3; border: 1px solid var(--gold); border-radius: 14px; overflow: hidden; background: linear-gradient(170deg, #111B26, #0A1017); }
#theo .tplate > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#theo .tplate .pl { position: absolute; inset: 0; z-index: 1; }
#theo .veil { position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, rgba(200, 184, 140, .30), rgba(200, 184, 140, .04)); clip-path: inset(0 0 100% 0); }
/* l'encoche du rang, en haut de la plaque, et le nom dans son cartouche, en bas, sur le fondu du drapé (maquette d'Astra) */
#theo .notch { position: absolute; z-index: 3; top: 0; left: 50%; transform: translateX(-50%); min-width: 46px; height: 21px; padding: 0 9px; display: grid; place-items: center; border: 1px solid var(--gold); border-top: 0; border-radius: 0 0 8px 8px; background: #0B121B; font: 500 .8125rem/1 var(--title); letter-spacing: .08em; color: var(--gold); }
#theo .name { position: absolute; z-index: 3; left: 8px; right: 8px; bottom: 8px; padding: 10px 6px 9px; border: 1px solid var(--gold-soft); border-radius: 6px; background: rgba(11, 18, 27, .84); font: 500 1.5rem/1 var(--title); letter-spacing: .12em; text-indent: .12em; text-transform: uppercase; color: var(--gold); text-align: center; }
#theo .trad { font: 400 .9375rem var(--sans); color: var(--soft); }

/* ---- feuille : Panthéon, Stats, Réglages */
#sheet { position: fixed; inset: 0; z-index: 10; overflow-y: auto; touch-action: pan-y; background: var(--night); padding: 0 18px calc(var(--sab) + 28px); }
#sheet[hidden] { display: none; }
#sheet header { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 12px; margin-bottom: 6px;
  position: sticky; top: 0; z-index: 2; background: var(--night); padding: calc(var(--sat) + 10px) 0 8px; } /* reste en haut quand la fiche fait défiler */
#sheet header #tabs { grid-column: 1 / -1; grid-row: 2; }
#to-home { justify-self: start; }
#to-home[hidden] { display: none; }
/* les onglets d'Astra (lot 6) : trois colonnes égales sur un filet ; l'onglet ouvert en champagne, souligné */
#tabs { display: grid; grid-template-columns: 1fr 1.3fr 1fr 1fr; gap: 0 8px; }
#sheet #tabs button { min-height: 44px; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; font: 400 .9375rem var(--sans); color: var(--soft); }
#sheet #tabs button[aria-selected="true"] { color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
.tab[hidden] { display: none; }
#sheet h2 { margin: 24px 0 10px; font: 500 1.375rem var(--title); letter-spacing: .06em; color: var(--ivory); }
#sheet h2:first-child { margin-top: 0; }
#sheet dl { display: grid; grid-template-columns: 1fr auto; gap: 9px 12px; margin: 0 0 14px; align-items: baseline; }
#sheet dt { color: var(--soft); font-size: .875rem; }
#sheet dt small { display: block; font: 400 .75rem var(--sans); color: var(--soft); }
#sheet dd { margin: 0; text-align: right; font: 600 1rem var(--sans); color: var(--ivory); font-variant-numeric: tabular-nums; }
#sheet label { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 64px; padding: 10px 0; border-top: 1px solid var(--line); }
#sheet label small { display: block; font-size: .8125rem; color: var(--soft); }
/* les interrupteurs d'Astra (lot 6) : 44 × 24, le bouton à gauche et creux quand c'est coupé, à droite et plein — avec un trait — quand c'est allumé :
   la forme le dit, pas seulement la teinte */
#sheet input[type="checkbox"] { -webkit-appearance: none; appearance: none; position: relative; flex: none; width: 44px; height: 24px; margin: 0; border: 1.5px solid var(--faint); border-radius: 12px; background: none; color: var(--faint); transition: border-color .14s ease-out, color .14s ease-out; }
#sheet input[type="checkbox"]::before { content: ""; position: absolute; top: 3px; left: 2px; width: 15px; height: 15px; border: 1.5px solid currentColor; border-radius: 50%; background: none; transition: transform .14s ease-out, background .14s ease-out; }
#sheet input[type="checkbox"]:checked { border-color: var(--gold); color: var(--gold); }
#sheet input[type="checkbox"]:checked::before { transform: translateX(22px); background: currentColor; }
#sheet input[type="checkbox"]:checked::after { content: ""; position: absolute; top: 9.75px; left: 6.5px; width: 7px; height: 1.5px; border-radius: 1px; background: currentColor; }
#sheet input[type="checkbox"]:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }
#sheet .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
#sheet .msg { font-size: .8rem; color: var(--soft); }
#sheet button.danger { color: var(--danger-ink); border-color: var(--danger-ink); background: none; }

/* les hauts faits (V.3, D60) : deux ciels — les exploits, la collection — chacun une constellation d'étoiles qui s'allument, et la liste dessous */
#titre { margin: 4px 0 14px; color: var(--soft); font-size: .875rem; line-height: 1.4; }
#titre b { color: var(--gold); font-weight: 500; }
.fait-sky { margin: 0 0 22px; }
.fait-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
#sheet .fait-head h2 { margin: 0; }
.fait-head span { font: 400 .8125rem var(--sans); font-variant-numeric: tabular-nums; color: var(--soft); }
.fait-const { display: block; width: 100%; height: auto; margin: 8px 0 4px; color: var(--gold); overflow: visible; }
.fait-const .link { stroke: var(--line-2); stroke-width: 1; fill: none; }
.fait-const .link.on { stroke: var(--gold-soft); }
.fait-const .dot { fill: none; stroke: var(--faint); stroke-width: 1.2; }
.fait-const .dot.on { fill: var(--gold); stroke: var(--gold); }
ul.faits { margin: 0; padding: 0; list-style: none; }
li.fait { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
li.fait svg { grid-row: 1 / span 2; width: 20px; height: 20px; color: var(--faint); }
li.fait.done svg { color: var(--gold); }
li.fait b { font: 500 .9375rem var(--sans); color: var(--soft); }
li.fait.done b { color: var(--ivory); }
li.fait small { grid-column: 2 / -1; color: var(--soft); font-size: .8125rem; line-height: 1.3; }
li.fait .n { grid-column: 3; grid-row: 1; font: 400 .8125rem var(--sans); font-variant-numeric: tabular-nums; color: var(--soft); }
/* panthéon : un ciel par tradition, dessiné en Canvas ; fiche au tap */
/* les traditions (lot 6 d'Astra) : son emblème, son nom ; celle qu'on regarde en champagne */
#trads { display: flex; gap: 2px 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
#sheet #trads button { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 6px 0; border: 0; border-radius: 0; background: none; font: 400 .8125rem var(--sans); color: var(--soft); }
#trads button svg { display: block; width: 24px; height: 24px; flex: none; }
#sheet #trads button[aria-selected="true"] { color: var(--gold); }
#sheet #trads button.locked { color: var(--faint); }
#count { margin-left: auto; font: 400 .8125rem var(--sans); font-variant-numeric: tabular-nums; color: var(--soft); }
/* le ciel (D56) : le plan lointain d'Astra, les constellations que dessine le code, le plan proche ; les deux plans bougent au
   doigt (3 pt et 7 pt au plus) et respirent au repos — jamais en « Réduire les animations » */
#skywrap { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #070D14; touch-action: manipulation; }
#skywrap img { position: absolute; left: -14px; top: -14px; width: calc(100% + 28px); height: calc(100% + 28px); object-fit: cover; pointer-events: none; will-change: transform; }
#sky-near { z-index: 2; }
#sky { position: relative; z-index: 1; display: block; width: 100%; }
/* la fiche (lot 6 d'Astra) : un cadre aux angles coupés — champagne pour un dieu nommé —, une encoche en haut */
#godcard { --frame: var(--line-2); --cut: 12px; position: relative; margin-top: 12px; padding: 1px; min-height: 108px; background: var(--frame);
  clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
#godcard .in { position: relative; min-height: 106px; padding: 15px 14px; background: var(--panel);
  clip-path: polygon(calc(var(--cut) - .42px) 0, calc(100% - var(--cut) + .42px) 0, 100% calc(var(--cut) - .42px), 100% calc(100% - var(--cut) + .42px), calc(100% - var(--cut) + .42px) 100%, calc(var(--cut) - .42px) 100%, 0 calc(100% - var(--cut) + .42px), 0 calc(var(--cut) - .42px)); }
#godcard::after { content: ""; position: absolute; top: 1px; left: 50%; width: 94px; height: 6px; margin-left: -47px; border: 1px solid var(--frame); border-top: 0; }
#godcard.named { --frame: var(--gold); }
#godcard.asleep::after { border-style: dashed; border-width: 0 0 1px; height: 0; top: 7px; }
#godcard.locked::after { display: none; }
/* non découvert, verrouillé : rien à montrer que ce qu'on sait — le titre, un vide en arche, les indices, une ligne */
#godcard.asleep, #godcard.locked { text-align: center; }
#godcard.asleep .who, #godcard.locked .who { flex-direction: column; align-items: center; gap: 2px; }
#godcard.asleep .who b, #godcard.locked .who b { font-size: 1.1875rem; }
#godcard .void { display: block; margin: 12px auto 4px; width: 62px; height: 92px; color: var(--line-2); }
#godcard .lock { display: block; margin: 12px auto 6px; width: 52px; height: 52px; color: var(--soft); }
#godcard.asleep .sig, #godcard.locked .sig { justify-content: center; }
#godcard .who { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#godcard .who b { font: 500 1.375rem var(--title); letter-spacing: .08em; text-transform: uppercase; }
#godcard.named .who b { color: var(--gold); }
#godcard .who span { font: 400 .8125rem var(--sans); color: var(--soft); }
#godcard .top { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; margin: 12px 0 2px; align-items: start; }
#godcard .top.bare { grid-template-columns: minmax(0, 1fr); }
#godcard .top.bare .portrait { display: none; }
#godcard .portrait { width: 128px; height: 192px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); opacity: 0; transition: opacity .3s; } /* le filet hors de la boîte : les calques gardent exactement 2 sur 3 */
#godcard .portrait.on { opacity: 1; }
#godcard .side { display: grid; gap: 10px; align-content: start; min-width: 0; }
#godcard .side .attr { margin: 0; }
#godcard .sig { display: flex; gap: 6px; margin: 10px 0; }
#godcard .side .sig { margin: 0; }
@media (max-height: 620px) { #godcard .top { grid-template-columns: 100px minmax(0, 1fr); gap: 12px; } #godcard .portrait { width: 100px; height: 150px; } }
#godcard .sig i { font: 600 .8125rem var(--sans); font-style: normal; letter-spacing: .02em; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--soft); }
#godcard .sig i.on { border-color: var(--gold-soft); color: var(--gold); background: var(--gold-dim); }
#godcard p { margin: 0; color: var(--ivory); font-size: .9375rem; line-height: 1.45; }
#godcard p.hint { color: var(--soft); }
#godcard p.attr { margin-top: 8px; color: var(--soft); font-size: .86rem; }
/* son pouvoir de Gardien, rang par rang (D48) : on ne le lit qu'une fois le dieu débloqué. Le rang atteint en or ; ceux
   d'avant ont un chiffre cerclé d'or, ceux à venir un chiffre en pointillé. */
#godcard .gardien { display: flex; align-items: center; gap: 8px; margin: 12px 0 -2px; font: 500 .875rem var(--sans); color: var(--gold); }
#godcard .gardien .pico { width: 22px; height: 22px; }
#godcard .ranks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
#godcard .ranks li { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 10px; align-items: start; color: var(--soft); font-size: .875rem; line-height: 1.4; }
#godcard .ranks i { font: 500 .8125rem/1 var(--title); font-style: normal; letter-spacing: .04em; text-align: center; padding: 4px 0; margin-top: 1px; border: 1px dashed var(--line-2); border-radius: 6px; color: var(--soft); }
#godcard .ranks li.done i { border: 1px solid var(--gold-soft); color: var(--gold); }
#godcard .ranks li.now { color: var(--gold); }
#godcard .ranks li.now i { border: 1px solid var(--gold); background: var(--gold-dim); color: var(--gold); }
#godcard p.next { margin-top: 8px; color: var(--soft); font-size: .84rem; }

/* le signal d'un pouvoir qui agit (lot 5 d'Astra) : la petite plaque de son dieu, à la teinte de sa tradition, à côté de sa niche */
#signal { position: fixed; z-index: 9; left: 0; top: 0; width: 100px; height: 40px; pointer-events: none; opacity: 0; }
#fx, #theo .fx-host { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
#fx img, #theo .fx-host img { position: absolute; width: 14px; height: 14px; pointer-events: none; opacity: 0; will-change: transform, opacity; }
#theo .fx-host { z-index: 4; }
@media (prefers-reduced-motion: reduce) {
  #godcard .portrait, .medal .disc, #sheet input[type="checkbox"], #sheet input[type="checkbox"]::before { transition: none; }
  #card, #card .inner, #xp i, .sym, .star, #passes span, .cue, .tally .mult { transition: none; }
  #altar-locked.deny { animation: none; }
  #card .face { transition: none !important; } /* les règles des faces sont plus spécifiques (#card.up .face.back) : sans !important leur délai de 170 ms survit */
}
</style>

<script>
// Le moteur de référence (engine/engine.js) est inliné ici tel quel par web/build.js,
// dans une portée de fonction : la page exécute exactement le fichier validé par npm test.
window.NoctuaireEngine = (function () {
  'use strict';
  const module = { exports: {} };
  
'use strict';
/**
 * NOCTUAIRE — moteur de règles de référence (v3 : deux autels, quatre axes, Patrons, XP).
 *
 * Ce fichier EST la spécification exécutable. Toute implémentation (web, Swift) doit
 * reproduire ses résultats sur engine/vectors.json. Aucune dépendance, aucun DOM.
 *
 * Vocabulaire code (le vocabulaire joueur est dans docs/SPEC-v3.md) :
 *  - card   : { dom: 0..7, ec: 1..6 }                (symbole, valeur)
 *  - altar  : { stars: [{dom, ec, ord}], taken: Set<dom>, patron: godName|null, flags }
 *  - action : 'T' | 'U' | 'L' | 'R' | 'D' | 'V'
 *      carte FACE CACHÉE : 'T' tirer (retourner, c'est l'engagement) · 'U' garder (clore la nuit)
 *                          'V' la vision de Nanna (voir la carte sans s'engager ; elle compte : au rang II, la carte
 *                          vue vaut double sur son autel, D48)
 *      carte FACE VISIBLE : 'L' poser à gauche · 'R' poser à droite · 'D' passer (coûte une passe)
 *    Règle cardinale (Flip 7) : on décide de continuer AVANT de voir la carte. Une carte retournée
 *    doit être posée ou passée ; si son symbole est pris sur tous les autels et qu'il ne reste
 *    aucune passe, elle fait tomber la nuit.
 */

// ---------------------------------------------------------------- données
const DOMS = ['CIEL', 'MER', 'TERRE', 'FEU', 'GUERRE', 'AMOUR', 'MORT', 'SAVOIR'];
const DOM_INDEX = Object.fromEntries(DOMS.map((d, i) => [d, i]));
const ECLATS = [1, 2, 3, 4, 5, 6];

const GODS = [
  ['Ishtar', 'Mésopotamie', ['AMOUR', 'GUERRE', 'CIEL']],
  ['Ereshkigal', 'Mésopotamie', ['MORT', 'TERRE', 'SAVOIR']],
  ['Enki', 'Mésopotamie', ['MER', 'SAVOIR', 'TERRE']],
  ['Nergal', 'Mésopotamie', ['MORT', 'GUERRE', 'FEU']],
  ['Nanna', 'Mésopotamie', ['CIEL', 'MER', 'SAVOIR']],
  ['Marduk', 'Mésopotamie', ['CIEL', 'GUERRE', 'SAVOIR']],
  ['Aphrodite', 'Grèce', ['AMOUR', 'MER', 'FEU']],
  ['Hadès', 'Grèce', ['MORT', 'TERRE', 'AMOUR']],
  ['Athéna', 'Grèce', ['GUERRE', 'SAVOIR', 'FEU']],
  ['Poséidon', 'Grèce', ['MER', 'TERRE', 'GUERRE']],
  ['Héphaïstos', 'Grèce', ['FEU', 'TERRE', 'SAVOIR']],
  ['Zeus', 'Grèce', ['CIEL', 'GUERRE', 'TERRE']],
  ['Taranis', 'Gaule', ['CIEL', 'FEU', 'GUERRE']],
  ['Epona', 'Gaule', ['TERRE', 'AMOUR', 'MER']],
  ['Cernunnos', 'Gaule', ['TERRE', 'MORT', 'FEU']],
  ['Lugus', 'Gaule', ['SAVOIR', 'FEU', 'CIEL']],
  ['Sucellos', 'Gaule', ['MORT', 'FEU', 'MER']],
  ['Belenos', 'Gaule', ['CIEL', 'AMOUR', 'MER']],
].map(([name, trad, sig]) => ({ name, trad, sig: sig.slice().sort().join('|'), sigArr: sig }));
const GOD_BY_NAME = Object.fromEntries(GODS.map(g => [g.name, g]));

// Pouvoirs des Patrons : un par dieu (D41), en trois rangs (D48). Le pouvoir s'applique à l'autel où son dieu est posé.
// `ranks[r - 1]` porte les paramètres du rang r et la phrase de la fiche (panthéon, préparation, bulle du Gardien). Le
// rang d'un Patron est le niveau de son dieu (I à V, +1 à chaque déblocage), plafonné à III : IV et V ne changent que
// l'apparence. À chaque rang, le même pouvoir grandit d'un cran, sans jamais rien retirer au rang d'avant. Chaque rang
// est mesuré et borné par `npm run check` : un gain réel, qui laisse le risque entier (D9, D48). Hermès, qui n'est pas au
// panthéon, a légué sa vision à Nanna.
const PATRONS = {
  // — Mésopotamie
  Ishtar: { kind: 'plus', ranks: [
    { doms: ['AMOUR', 'GUERRE'], plus: 1, text: 'AMOUR et GUERRE valent +1 sur son autel.' },
    { doms: ['AMOUR', 'GUERRE'], plus: 2, text: 'AMOUR et GUERRE valent +2 sur son autel.' },
    { doms: ['AMOUR', 'GUERRE', 'CIEL'], plus: 2, text: 'AMOUR, GUERRE et CIEL valent +2 sur son autel.' },

  Ereshkigal: { kind: 'discardValue', ranks: [
    { per: 1, text: 'Chaque carte passée vaut 1 sur son autel.' },
    { per: 2, text: 'Chaque carte passée vaut 2 sur son autel.' },
    { per: 3, text: 'Chaque carte passée vaut 3 sur son autel.' },
  ] },
  Enki: { kind: 'plus', ranks: [
    { doms: ['MER', 'SAVOIR'], plus: 1, text: 'MER et SAVOIR valent +1 sur son autel.' },

    { doms: ['MER', 'SAVOIR', 'TERRE'], plus: 2, text: 'MER, SAVOIR et TERRE valent +2 sur son autel.' },

  Nergal: { kind: 'twice', ranks: [
    { doms: ['FEU'], max: 2, text: 'FEU peut être posé deux fois sur son autel.' },
    { doms: ['FEU', 'GUERRE'], max: 2, text: 'FEU et GUERRE peuvent être posés deux fois sur son autel.' },
    { doms: ['FEU', 'GUERRE', 'MORT'], max: 2, text: 'FEU, GUERRE et MORT peuvent être posés deux fois sur son autel.' },
  ] },
  Nanna: { kind: 'peek', ranks: [
    { uses: 1, bless: 1, text: 'Une fois par nuit, voir la carte cachée sans s’engager.' },
    { uses: 1, bless: 2, text: 'Une fois par nuit, voir la carte cachée sans s’engager ; posée sur son autel, elle vaut double.' },
    { uses: 1, bless: 3, text: 'Une fois par nuit, voir la carte cachée sans s’engager ; posée sur son autel, elle vaut triple.' },
  ] },
  Marduk: { kind: 'fromNth', ranks: [
    { from: 6, plus: 1, text: 'Dès la sixième, chaque étoile de son autel vaut +1.' },

  // — Grèce
  Aphrodite: { kind: 'double', ranks: [
    { doms: ['AMOUR'], times: 2, plus: 0, text: 'AMOUR vaut double sur son autel.' },
    { doms: ['AMOUR'], times: 2, plus: 2, text: 'AMOUR vaut double sur son autel, plus 2.' },
    { doms: ['AMOUR'], times: 3, plus: 2, text: 'AMOUR vaut triple sur son autel, plus 2.' },
  ] },
  Hadès: { kind: 'dupFree', ranks: [
    { uses: 1, text: 'Le premier « déjà pris » posé sur son autel est défaussé sans coûter de passe.' },
    { uses: 2, text: 'Les deux premiers « déjà pris » posés sur son autel sont défaussés sans coûter de passe.' },
    { uses: 3, text: 'Les trois premiers « déjà pris » posés sur son autel sont défaussés sans coûter de passe.' },
  ] },
  Athéna: { kind: 'passValue', ranks: [

/** Démarre une nuit : la première carte est face cachée, le joueur doit la tirer ('T'). */

/**

  { id: 'petites', family: 'paquet', arg: 'symbole', text: 'Retire du paquet les 1 et les 2 d’un symbole, pour la suite de la Veillée.' },

/** newVeillee({ seed, kind: 'petite'|'grande', level, patrons, ranks, gods }) — gods : { nom: niveau } des dieux débloqués. */

    flag('deuxcents', 'Deux cents points', 'Marque 200 points en une nuit.', (p.best || 0) >= 200),

/** La carte c ferait-elle tout tomber partout, compte tenu des pouvoirs (vision de Nanna) ? */
function wouldFall(n, c) {
  return n.altars.every((_, i) => !E.placeable(n, i, c.dom) && !E.protects(n, i, c.dom) && !E.upgrades(n, i, c));
}

function policy(n, T, D) {
  const total = n.altars.reduce((s, a) => s + a.stars.length, 0);
  if (!n.faceUp) {
    // décision Flip 7 : continuer ou garder, AVANT de voir la carte
    const remaining = n.deck.length - n.idx;
    const danger = remaining > 0 ? E.dangerCount(n) / remaining : 1;
    if (total >= T) return 'U';
    if (n.passes === 0 && total >= 3) {
      if (n.seenIdx === n.idx) return wouldFall(n, E.current(n)) ? 'U' : 'T'; // la vision a parlé
      if (E.peeksLeft(n)) return 'V';                                         // Nanna : la vision sert au moment le plus dangereux
      if (danger > D) return 'U';
    }
    return 'T';
  }
  const c = E.current(n);
  const free = n.altars.map((_, i) => (E.placeable(n, i, c.dom) ? i : -1)).filter(i => i >= 0);
  if (free.length === 0) {
    const up = n.altars.findIndex((_, i) => E.upgrades(n, i, c));                                   // Lugus : mieux qu'une passe
    if (up >= 0) return side(up);
    const cheap = n.altars.findIndex((a, i) => a.power && ['dupFreeSym', 'earlyGuard'].includes(a.power.kind) && E.protects(n, i, c.dom));
    if (cheap >= 0) return side(cheap);                                                              // Poséidon, Epona : gratuit
    if (n.passes > 0) return 'D';
    const h = n.altars.findIndex((_, i) => E.protects(n, i, c.dom));                                  // Hadès, en dernier recours
    if (h >= 0) return side(h);
    return 'L'; // forcé : tomber
  }
  if (free.length === 1) return side(free[0]);
  const seer = n.altars.findIndex((a, i) => a.power && a.power.kind === 'peek' && a.power.bless > 1 && n.seenIdx === n.idx && free.includes(i));
  if (seer >= 0) return side(seer);                                                                  // Nanna : la carte vue va chez elle
  // deux autels libres : préférer la paire, sinon l'autel le moins rempli
  const pair = n.altars.findIndex((a, i) => n.altars[1 - i].taken.has(c.dom));
  if (pair >= 0) return side(pair);
  return n.altars[0].stars.length <= n.altars[1].stars.length ? 'L' : 'R';
}

function playNight(opts, T, D) {
  const n = E.start(opts);
  const actions = [];
  for (let guard = 0; guard < 120; guard++) {
    const a = policy(n, T, D); actions.push(a);
    const r = E.act(n, a);
    if (r.result) return { result: r.result, actions };
  }
  throw new Error('boucle');
}

/** Une nuit de Veillée (D50) : sous la cible, garder, c'est perdre la Veillée, alors on retourne — sauf quand la vision de
 *  Nanna montre une carte qui ferait tout tomber : garder sauve au moins les points de la nuit. La cible atteinte, on garde. */
function veilleePolicy(n, target) {
  if (!n.faceUp) {
    const any = n.altars.some(a => a.stars.length);
    if (any && E.nightScoreRaw(n) >= target) return 'U';
    if (n.passes === 0 && any) {
      if (n.seenIdx === n.idx) return wouldFall(n, E.current(n)) ? 'U' : 'T';
      if (E.peeksLeft(n)) return 'V';
    }
    return 'T';
  }
  return policy(n, 99, 1); // la pose : celle du joueur moyen
}
/** L'Offrande du joueur moyen : la première proposée, avec un argument simple et déterministe. */
function pickOffering(v, offers) {
  const id = offers[0], o = E.OFFRANDE_BY_ID[id];
  let arg = null;
  if (o.arg === 'symbole') arg = (v.night * 3 + 1) % E.DOMS.length;
  else if (id === 'rang') arg = v.patrons.findIndex((g, i) => g && i < v.altars && (v.ranks[i] || 1) < E.POWER_RANKS);
  else if (o.arg === 'autel') arg = 0;
  else if (id === 'change') arg = { altar: 0, god: Object.keys(v.gods).sort().find(g => E.PATRONS[g] && !v.patrons.includes(g)) };
  return { id, arg };
}
/** Une Veillée entière jouée par le joueur moyen : ses gestes nuit par nuit, les Offrandes proposées et choisies. */
function playVeillee(vopts) {
  const v = E.newVeillee(vopts), nights = [], offers = [], choices = [];
  for (let guard = 0; guard < 10 && !v.over; guard++) {
    const { opts, target } = E.veilleeNight(v);
    const n = E.start(opts), actions = [];
    let res = null;
    for (let g = 0; g < 200 && !res; g++) { const a = veilleePolicy(n, target); actions.push(a); const r = E.act(n, a); if (r.result) res = r.result; }
    nights.push(actions);
    E.veilleeEnd(v, res);
    if (v.over) break;
    const o = E.veilleeOffers(v), c = pickOffering(v, o);
    offers.push(o); choices.push(c);
    E.veilleeChoose(v, c.id, c.arg);
  }
  return { v, nights, offers, choices };
}

/** Le fantôme du Défi du jour : le joueur moyen (il garde à dix étoiles, sans passe dès que le danger dépasse six chances sur dix)
 *  joue la nuit du jour avec ses deux Gardiens. Une référence pour le score du joueur, jamais un adversaire en direct. */
const GHOST = { T: 10, D: .6 };
function defiGhost(date, level) {
  const { result, actions } = playNight(E.defiOpts(date, level), GHOST.T, GHOST.D);
  return { kind: result.kind, score: result.score, stars: result.stars, actions };
}

    const lesson = LESSONS[name];

    n.seed = lesson.seed;
    state.tuto = { lesson: name, step: 0 };

  function lessonFor(opts, L) {
    const open = (name) => LESSONS[name].altars <= E.altarsForLevel(L);
    if (opts.lesson) return open(opts.lesson) ? opts.lesson : null;
    if (opts.seed || state.seedOnce) return null;                    // graine imposée : pas de leçon d'office
    if (!profile.tutorialDone) return 'first';
    if (open('pair') && !profile.pairLessonDone) return 'pair';      // la première nuit à deux autels
    return null;

  /** Le ciel de l'accueil : un semis fixe, et tes dieux débloqués en or pâle autour du nom. */

    }

    const SPOTS = [[.5, .14], [.2, .2], [.8, .2], [.33, .4], [.67, .4], [.1, .52], [.9, .52], [.12, .83], [.88, .83]];
    const size = Math.min(w * .19, h * .2);
    const c = cv.getBoundingClientRect(), l = $('logo').getBoundingClientRect(); // le nom, mesuré : aucune figure ne le touche
    const logo = { x0: l.left - c.left - 10, x1: l.right - c.left + 10, y0: l.top - c.top - 10, y1: l.bottom - c.top + 10 };
    TRADS.flatMap((t) => SKY_ORDER[t]).filter((g) => profile.gods[g]).slice(0, SPOTS.length).forEach((g, i) => {
      const f = FIGURES[g];
      const cx = Math.min(Math.max(SPOTS[i][0] * w, size / 2 + 4), w - size / 2 - 4);
      let cy = Math.min(Math.max(SPOTS[i][1] * h, size / 2 + 4), h - size / 2 - 4);
      if (cx + size / 2 > logo.x0 && cx - size / 2 < logo.x1 && cy + size / 2 > logo.y0 && cy - size / 2 < logo.y1) {
        cy = cy < (logo.y0 + logo.y1) / 2 ? logo.y0 - size / 2 : Math.min(logo.y1 + size / 2, h - size / 2 - 4); // au-dessus ou au-dessous du nom
      }
      const pts = f.pts.map(([px, py]) => ({ x: cx + (px - .5) * size, y: cy + (py - .5) * size }));
      x.beginPath(); for (const [a, b] of f.edges) { x.moveTo(pts[a].x, pts[a].y); x.lineTo(pts[b].x, pts[b].y); }
      x.strokeStyle = 'rgba(200, 184, 140, .26)'; x.lineWidth = .8; x.stroke();
      pts.forEach((p, k) => { const sig = f.sig.includes(k); x.beginPath(); x.arc(p.x, p.y, sig ? 1.6 : .9, 0, Math.PI * 2); x.fillStyle = `rgba(240, 234, 220, ${sig ? .7 : .32})`; x.fill(); });
    });
  }
  // Jouer : la Veillée dès qu'elle est ouverte (reprise si l'une est en cours) ; « Une nuit libre » à côté
  $('home-play').addEventListener('click', () => {
    audio.unlock();
    if (state.veillee) { resumeVeillee(); return; }
    state.vmode = veilleeOpen() ? veilleeKind() : null;
    if (E.patronSlotsForLevel(level()) > 0) showVestibule(); else if (state.vmode) startVeillee(state.vmode); else startNight();
  });
  $('home-free').addEventListener('click', () => { audio.unlock(); state.vmode = null; if (E.patronSlotsForLevel(level()) > 0) showVestibule(); else startNight(); });
  $('h-kind').addEventListener('click', (e) => { const b = e.target.closest('button[data-kind]'); if (!b) return; settings.vkind = b.dataset.kind; saveSettings(); renderHome(); });
  $('home-defi').addEventListener('click', () => { audio.unlock(); startDefi(); });
  $('home-pantheon').addEventListener('click', () => { state.tab = 'pantheon'; openSheet(); });
  $('home-settings').addEventListener('click', () => { state.tab = 'reglages'; openSheet(); });
  $('back').addEventListener('click', () => showHome());
  function renderVestibule() {
    if (!state.vest) return;
    const L = level(), altars = E.altarsForLevel(L), slots = E.patronSlotsForLevel(L), P = activePatrons(L);
    const named = TRADS.flatMap((t) => SKY_ORDER[t]).filter((g) => profile.gods[g] && E.PATRONS[g]);
    for (let i = 0; i < 2; i++) {
      const col = document.querySelector(`.v-altar[data-altar="${i}"]`), name = i === 0 ? 'Aube' : 'Crépuscule';
      if (i >= altars) { col.innerHTML = `<div class="v-column" aria-label="Autel du Crépuscule, s’ouvre au niveau 3"><b>Crépuscule</b><span>NIV.<br>3</span></div>`; continue; }
      const g = P[i];
      const niche = g
        ? `<div class="v-slot"><button class="v-niche filled${ringClass(godLvl(g))}${state.vsel === g ? ' sel' : ''}" data-altar="${i}" aria-label="${name} : ${nameLvl(g)}. Toucher pour lire son pouvoir">${medallion(g)}<span>${g}</span></button>` +
          `<button class="v-remove" data-remove="${i}" aria-label="Retirer ${g} de ${i === 0 ? 'l’Aube' : 'du Crépuscule'}">×</button></div>`
        : `<button class="v-niche" data-altar="${i}" aria-label="${name} : aucun Gardien"><i class="empty"></i></button>`;
      col.innerHTML = niche + `<div class="v-column"><b>${name}</b></div>`;
    }
    $('vgods').innerHTML = named.map((g) => {
      const lvl = profile.gods[g].lvl, placed = P.includes(g);
      return `<button class="medal${ringClass(lvl)}${placed ? ' placed' : ''}${state.vsel === g ? ' sel' : ''}" data-god="${g}" aria-label="${nameLvl(g, lvl)}${placed ? ', déjà sur un autel' : ''}">` +
        `<span class="disc">${medallion(g, lvl)}</span><span class="who">${g}${lvl > 1 ? `<small>${ROMAN[lvl]}</small>` : ''}</span></button>`;
    }).join('');
    const vl = $('v-line'), vm = state.vmode && veilleeOpen(L); // la Veillée qu'on prépare
    vl.hidden = !vm;
    if (vm) vl.innerHTML = `<b>Veillée n° ${vstats().played + 1}</b><span>${state.vmode === 'grande' ? 'Cinq nuits' : 'Trois nuits'}</span>`;
    const shelf = $('vgods');
    shelf.classList.toggle('more', shelf.scrollHeight > shelf.clientHeight + 2 && shelf.scrollTop + shelf.clientHeight < shelf.scrollHeight - 2);
    const sel = state.vsel;
    $('vcaption').innerHTML = sel ? `<b>${nameLvl(sel)}</b> · ${E.power(sel, godLvl(sel)).text}`
      : !named.length ? 'Débloque un dieu : il veillera sur un autel.'
      : slots === 1 && altars === 2 ? 'Un seul de tes dieux veille : glisse-le sur l’autel de ton choix.'
      : 'Tes dieux : glisse-les sur un autel. Touche-en un pour lire son pouvoir.';
  }
  /** Poser un dieu sur la niche d'un autel : il quitte l'autre ; avec une seule place, il change d'autel. */
  function assign(god, i) {
    const L = level();
    if (!E.patronSlotsForLevel(L) || i >= E.altarsForLevel(L) || !profile.gods[god]) return; // avant le niveau 2, Jouer ne passe pas par ici
    const p = activePatrons(L);
    for (let k = 0; k < 2; k++) if (p[k] === god) p[k] = null;
    p[i] = god;
    if (E.patronSlotsForLevel(L) < 2) p[1 - i] = null;
    profile.patrons = p; saveProfile(); state.vsel = null; render();
    const niche = document.querySelector(`.v-niche[data-altar="${i}"]`);
    if (niche) anim(niche, [{ transform: 'scale(1)' }, { transform: 'scale(1.06)', offset: .4 }, { transform: 'scale(1)' }], 320);
    haptic(10);
  }
  function unassign(i) { const p = activePatrons(); p[i] = null; profile.patrons = p; saveProfile(); render(); }
  const ghost = $('ghost');
  let vd = null; // un médaillon qu'on glisse
  const nicheAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.v-niche'); };
  const clearTargets = () => document.querySelectorAll('.v-niche.target').forEach((x) => x.classList.remove('target'));
  $('vgods').addEventListener('pointerdown', (e) => {
    const m = e.target.closest('.medal');
    if (!m || e.button > 0) return;
    vd = { god: m.dataset.god, x0: e.clientX, y0: e.clientY, moved: false, id: e.pointerId };
    try { m.setPointerCapture(e.pointerId); } catch (err) { /* sans capture, le glisser marche quand même */ }
  });
  $('vgods').addEventListener('pointermove', (e) => {

      vd.moved = true;

    }
    if (!vd.moved) return;
    ghost.style.transform = `translate(${Math.round(e.clientX - 32)}px, ${Math.round(e.clientY - 26)}px)`;
    const over = nicheAt(e.clientX, e.clientY);

  });
  $('vgods').addEventListener('pointerup', (e) => {
    if (!vd || e.pointerId !== vd.id) return;
    const d = vd; vd = null; ghost.hidden = true; clearTargets();
    if (!d.moved) { state.vsel = state.vsel === d.god ? null : d.god; render(); return; } // toucher : lire son pouvoir, puis toucher une niche
    const over = nicheAt(e.clientX, e.clientY);

  });
  $('vgods').addEventListener('pointercancel', () => { vd = null; ghost.hidden = true; clearTargets(); });
  $('vgods').addEventListener('scroll', () => { const sh = $('vgods'); sh.classList.toggle('more', sh.scrollTop + sh.clientHeight < sh.scrollHeight - 2); });
  $('vestibule').addEventListener('click', (e) => {
