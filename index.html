<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noctuaire">
<meta name="noctuaire-version" content="5610e05 2026-09-23T16:49:00+02:00">
<meta name="theme-color" content="#0B0E14">
<title>Noctuaire</title>
<style>
:root {
  --night: #0B0E14; --panel: #131824; --panel-2: #1A2030;
  --ink: #E8E9EE; --soft: #97A0B0; --faint: #4B5364; --line: #232A38; --line-2: #3A4356;
  --gold: #D2A24C; --gold-soft: #8C6A2E; --gold-dim: rgba(210, 162, 76, .16);
  --ivory: #F1ECDF; --danger: #C9574A;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); /* zones sûres iOS ; ?safe=1 les simule hors appareil */
  --card-w: 200px; /* recalculée en JS d'après l'espace réel du puits (Safari avec barre, plein écran, consigne affichée) */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  margin: 0; height: 100%; color: var(--ink);
  background: var(--night);
  font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: none; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:active { opacity: .6; }
#app {
  height: 100%; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px;
  padding: calc(var(--sat) + 8px) 12px 0; /* 8 px : la cible de 44 pt du menu (marge −8 px) affleure le bord sans le dépasser */
  background: radial-gradient(120% 70% at 50% 28%, #121826 0%, var(--night) 62%);
}

/* ---- barre du haut (D45) : la progression à gauche, un vrai bouton Menu à droite ; plus de titre, le nom est à l'accueil.
   Pendant la préparation, « ‹ Accueil » prend la place de la progression. */
#head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 14px; min-height: 44px; }
#prog { display: flex; align-items: center; gap: 10px; min-width: 0; }
#level { flex: none; font: 500 .78rem var(--mono); letter-spacing: .08em; color: var(--gold); }
#xp { flex: 1; max-width: 140px; height: 2px; background: var(--line); border-radius: 1px; }
#xp i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .6s ease; }
#menu, #back { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; background: rgba(19, 24, 36, .7);
  font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
#back { justify-self: start; }
#back[hidden], #prog[hidden] { display: none; }
#menu .bars { display: inline-grid; gap: 3px; } /* trois traits dessinés : l'icône reste nette à toutes les tailles */
#menu .bars i { display: block; width: 13px; height: 1.5px; border-radius: 1px; background: currentColor; }

/* ---- rail : les 8 symboles ; sous chacun, une pastille par carte encore dans le paquet (rouges quand elles tuent) */
#rail { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.sym { border: 1px solid var(--line); border-radius: 6px; padding: 6px 5px 6px; text-align: center; line-height: 1.1; transition: background .2s, border-color .2s; }
.sym b { display: block; font: 600 .74rem var(--mono); letter-spacing: .06em; }
.sym .pips { display: flex; gap: 2px; height: 3px; margin-top: 6px; }
.sym .pips s { flex: 1; border-radius: 1px; background: var(--soft); text-decoration: none; }
.sym .pips s.gone { background: var(--line); }
.sym.taken { background: var(--gold); border-color: var(--gold); color: #1A1408; } /* pris partout : chaque carte restante tue */
.sym.taken .pips s { background: #8E1B10; }
.sym.taken .pips s.gone { background: rgba(26, 20, 8, .22); }
/* pris d'un seul côté : la moitié correspondante s'allume — l'autre côté reste ouvert, et fait la paire */
.sym.half-l, .sym.half-r { border-color: var(--gold-soft); }
.sym.half-l { background: linear-gradient(90deg, var(--gold-dim) 50%, transparent 50%); }
.sym.half-r { background: linear-gradient(270deg, var(--gold-dim) 50%, transparent 50%); }
.sym.half-l b, .sym.half-r b { color: var(--gold); }
.sym.flash { background: #A8392C; border-color: #A8392C; color: #fff; } /* rouge assez profond pour que le blanc passe 6,4:1 */
.sym.flash .pips s { background: rgba(255, 255, 255, .92); }
.sym.flash .pips s.gone { background: rgba(255, 255, 255, .25); }

/* ---- scène : les deux autels tiennent les côtés (on pose à gauche et à droite, on le voit), la carte est
   au centre, la défausse est en bas (on passe vers le bas, la carte y tombe). Les quatre axes deviennent
   quatre destinations visibles. La fin de nuit se pose par-dessus. */
#stage { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; column-gap: 8px; row-gap: 4px; align-items: stretch; min-height: 0; }
#consigne { grid-column: 1 / -1; grid-row: 1; max-width: 32ch; margin: 0 auto; text-align: center; color: var(--ivory); font-size: .92rem; line-height: 1.32; min-height: 2.6em; display: grid; align-items: center; }
#consigne[hidden] { display: none; }
#well { grid-column: 2; grid-row: 2; position: relative; display: grid; place-items: center; min-height: 0; }
#aid { grid-column: 1 / -1; grid-row: 3; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding-bottom: 4px; }
#aid[hidden] { display: none; }

.cue { position: absolute; margin: 0; font: 500 .7rem var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); opacity: .72; transition: color .15s, opacity .15s; pointer-events: none; white-space: nowrap; }
.cue.on { color: var(--gold); opacity: 1; }
.cue.up { top: 2px; left: 50%; transform: translateX(-50%); }
.cue.down { bottom: 2px; left: 50%; transform: translateX(-50%); }
/* « Poser » se tient au milieu de la gouttière, entre les paliers de l'autel (ils finissent ≈ 10 px dans le puits)
   et le bord de la carte : collé au bord du puits, il tombait sur le ×2, toujours à mi-hauteur. −1,5 px = 5 − 6,5,
   la demi-largeur du repère ; fitBoard garantit la place (voir la largeur de carte). */
.cue.left { left: calc(25% - var(--card-w) / 4 - 1.5px); top: 50%; writing-mode: vertical-rl; transform: translateY(-50%) rotate(180deg); }
.cue.right { right: calc(25% - var(--card-w) / 4 - 1.5px); top: 50%; writing-mode: vertical-rl; transform: translateY(-50%); }
.cue[hidden] { display: none; }

#card { position: relative; width: var(--card-w); aspect-ratio: 2 / 3; will-change: transform; transition: width .2s; }
#card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 340ms cubic-bezier(.2, .7, .2, 1); }
#card.up .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 14px; } /* pas de backface-visibility : la bascule de visibilité ci-dessous suffit et rend pareil partout */
.face.back { background-color: #131824; background-image:
    radial-gradient(70% 50% at 50% 42%, rgba(210, 162, 76, .10), transparent 70%),
    linear-gradient(160deg, #1E2536, #10141E 60%, #0E121B);
  box-shadow: inset 0 0 0 1px var(--line), inset 0 0 0 7px #0B0E14, inset 0 0 0 8px rgba(210, 162, 76, .32), 0 10px 26px rgba(0, 0, 0, .45); }
.face.back::before { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(210, 162, 76, .14); border-radius: 4px; }
.face.back::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(45deg);
  border: 1px solid var(--gold); opacity: .6; box-shadow: 0 0 18px rgba(210, 162, 76, .25), inset 0 0 12px rgba(210, 162, 76, .14); }
.face.front { color: var(--night); transform: rotateY(180deg); display: grid; place-items: center;
  background-color: var(--ivory);
  background-image: radial-gradient(120% 90% at 30% 12%, #FFFCF4, rgba(241, 236, 223, 0) 55%), linear-gradient(170deg, rgba(255, 252, 244, .6), rgba(228, 222, 205, .55));
  box-shadow: 0 14px 34px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(20, 18, 14, .10); }
.face.front::after { content: ""; position: absolute; inset: 9px; border: 1px solid rgba(20, 18, 14, .13); border-radius: 7px; }
.face.front, #card.up .face.back { visibility: hidden; transition: visibility 0s 170ms; } /* les faces s'échangent à mi-retournement */
#card.up .face.front { visibility: visible; }
#card.snap .inner, #card.snap .face { transition: none !important; } /* nouvelle carte : pas de retournement, donc pas de délai */
.face.front .name { position: absolute; top: 12px; left: 14px; font: 600 .8rem/1.2 var(--mono); letter-spacing: .12em; }
.face.front .name small { display: block; margin-top: 2px; font-size: .7rem; letter-spacing: .1em; color: #63605A; } /* le code du rail et de l'autel, pour l'apprendre */
.face.front .val { font: 300 4.6rem/1 var(--sans); font-style: normal; letter-spacing: -.04em; color: #14120E; }
.face.front .pipline { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
.face.front .pipline s { width: 5px; height: 5px; border-radius: 50%; background: #14120E; opacity: .18; text-decoration: none; }
.face.front .pipline s.on { opacity: .8; }
/* anneau de maintien (réglage) : se remplit en 600 ms, puis garde */
#card.ring::before { content: ""; position: absolute; inset: -10px; border-radius: 22px; background: conic-gradient(var(--gold) var(--ring, 0deg), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }

#aid button, #sheet button { min-height: 44px; background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 16px; font: 500 .7rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
#aid button:disabled { opacity: .3; }

/* ---- autel : une colonne par côté, qui se remplit du bas vers le haut ; le palier est écrit sur la place
   qui le déclenche (4, 6, 8). L'autel du Crépuscule existe dès le niveau 1, verrouillé : on voit ce qu'on gagnera. */
.altar { grid-row: 2; align-self: center; display: flex; flex-direction: column; gap: 6px; width: var(--altar-w, 58px); }
.altar[data-altar="0"] { grid-column: 1; }
.altar[data-altar="1"], #altar-locked { grid-column: 3; }
.stars { display: flex; flex-direction: column-reverse; gap: 3px; } /* la première place est en bas : l'autel monte */
.star { position: relative; z-index: 0; height: var(--slot-h, 30px); border-radius: 5px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; line-height: 1; transition: transform .25s, opacity .25s; }
.star.on { border: 1px solid var(--line-2); background: var(--panel); }
.star.on b { font: 600 .7rem/1 var(--mono); letter-spacing: 0; color: var(--soft); }
.star.on i { font: 500 .95rem/1 var(--sans); font-style: normal; }
.star.big { border-color: var(--gold-soft); background: var(--panel-2); } /* les trois plus fortes : plus marquées */
.star.big i { font-size: 1.15rem; color: var(--ivory); }
/* une paire : le même symbole des deux côtés, les deux étoiles doublent */
.star.pair { border-color: var(--gold); background: var(--gold-dim); }
.star.pair i { color: var(--gold); }
.star.pair::before { content: ""; position: absolute; top: 50%; width: 7px; height: 1px; background: var(--gold); opacity: .7; }
.altar[data-altar="0"] .star.pair::before { left: 100%; }
.altar[data-altar="1"] .star.pair::before { right: 100%; }
.star.fallen { opacity: .18; transform: translateX(-6px); }
/* le palier : un vrai élément (et non un ::after) pour que les tests mesurent qu'aucun repère ne le chevauche */
.mark { position: absolute; top: 50%; transform: translateY(-50%); font: 600 .7rem/1 var(--mono); color: #5B6476; transition: color .3s; pointer-events: none; }
.altar[data-altar="0"] .mark { left: calc(100% + 5px); }
.altar[data-altar="1"] .mark { right: calc(100% + 5px); }
.mark.reached { color: var(--gold-soft); }
.mark.current { color: var(--gold); }
#stage.over .mark { visibility: hidden; } /* nuit finie : les paliers ne servent plus, et le panneau de fin les couvrirait à moitié */
.tally { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px; border-top: 1px solid var(--line); }
.tally .sum { font: 500 1.25rem/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tally .mult { font: 600 .7rem/1 var(--mono); letter-spacing: .06em; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--soft); transition: color .3s, border-color .3s, background .3s; }
.tally .mult.up { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); } /* multiplicateur en cours, mis en valeur dès ×2 */
.altar.ruin .sum { color: var(--danger); }
/* l'autel à venir : la place est tenue, le niveau qui l'ouvre est écrit dessus */
#altar-locked { grid-row: 2; align-self: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
  width: var(--altar-w, 58px); height: var(--altar-h, 280px); border: 1px dashed var(--line); border-radius: 8px; color: var(--soft); padding: 10px 2px; }
#altar-locked[hidden] { display: none; }
#altar-locked b { writing-mode: vertical-rl; font: 600 .7rem/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); }
#altar-locked span { font: 600 .7rem/1.2 var(--mono); letter-spacing: .04em; text-align: center; }
#altar-locked.deny { animation: denyPulse .5s ease-out; }
@keyframes denyPulse { 0% { border-color: var(--line); } 35% { border-color: var(--gold); color: var(--gold); } 100% { border-color: var(--line); } }

/* ---- défausse : ce que coûtent les passes, en bas, là où le geste envoie la carte */
#tray { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  margin: 0 -12px; padding: 8px 18px calc(var(--sab) + 8px); border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(19, 24, 36, .9), #0D1017); }
#tray .bloc { display: flex; flex-direction: column; align-items: center; gap: 5px; }
#tray .label { font: 500 .7rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
#passes { display: flex; gap: 7px; height: 30px; align-items: center; }
#passes span { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--soft); transition: background .3s, border-color .3s, opacity .3s; }
#passes span.on { background: var(--soft); }
#passes span.off { border-color: var(--faint); opacity: .5; }
#discard { position: relative; width: 44px; height: 30px; border-radius: 5px; border: 1px dashed var(--line); display: grid; place-items: center;
  font: 600 .8rem/1 var(--mono); color: var(--soft); }
#discard.has { border-style: solid; border-color: var(--line-2); background: var(--panel); color: var(--soft); }

/* ---- fin de nuit */
/* sans fond : la carte est déjà partie quand ce panneau paraît, il n'a rien à cacher (un fond opaque dessinait un
   rectangle sombre entre les deux colonnes, un halo laissait un contour à sa lisière) */
#end { grid-column: 2; grid-row: 1 / -1; z-index: 3; display: grid; place-content: center; gap: 10px; padding: 0 6px; text-align: center; cursor: pointer; }
#end[hidden] { display: none; }
#end .kicker { font: 500 .74rem var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); }
#end.bust .kicker { color: var(--danger); font-size: .95rem; line-height: 1.4; }
#end .score { font: 500 5rem/1 var(--sans); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
#end .sub { color: var(--soft); }
#end .gods { color: var(--gold); font-size: 1.1rem; }
#end .gods small { margin-left: 8px; font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
#end .gain { margin: -2px auto 0; max-width: 32ch; color: var(--ivory); font-size: .9rem; line-height: 1.4; } /* ce que le rang nouveau apporte (D48) */
#end .graze { font-size: .88rem; color: var(--soft); }
#end .graze b { color: var(--gold); font-weight: 500; }
#end .again { margin-top: 26px; font: 500 .74rem var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
/* déblocage : le moment de la progression, encadré, jamais une ligne perdue */
#end .unlock { margin: 14px auto 0; padding: 12px 16px; max-width: 30ch; border: 1px solid var(--gold-soft); border-radius: 10px; background: var(--gold-dim); }
/* petit écran : la fin la plus chargée (un dieu renforcé, ce que son pouvoir devient, un palier) tient entre le rail et
   les passes — le panneau, centré, débordait des deux côtés */
@media (max-height: 620px) {
  #end { gap: 6px; }
  #end .score { font-size: 3.6rem; }
  #end .again { margin-top: 12px; }
  #end .unlock { margin-top: 6px; padding: 8px 12px; }
}
#end .unlock em { display: block; font: 500 .7rem var(--mono); font-style: normal; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 5px; }
#end .unlock span { color: var(--ivory); font-size: .95rem; }

/* ---- Patron sur son autel : sa figure en tête de colonne ; elle s'allume quand le pouvoir agit */
.plate { height: 44px; width: 100%; border: 1px solid var(--gold-soft); border-radius: 8px; background: var(--gold-dim); display: grid; place-items: center; padding: 0; color: var(--gold); }
.plate.none { visibility: hidden; } /* l'autre autel garde la même hauteur : les places restent alignées */
.plate svg { display: block; }
.plate.used { opacity: .45; } /* Nanna : la vision de la nuit est prise */
.plate.glow { animation: plateGlow .6s ease-out; }
@keyframes plateGlow { 0% { box-shadow: 0 0 0 0 rgba(210, 162, 76, 0); } 30% { box-shadow: 0 0 0 4px rgba(210, 162, 76, .45); background: rgba(210, 162, 76, .32); } 100% { box-shadow: 0 0 0 0 rgba(210, 162, 76, 0); } }
button.plate:disabled { cursor: default; }
/* une étoile que le Patron de son autel fait valoir plus : un point d'or, et la valeur réelle */
.star.boost::after { content: ""; position: absolute; top: 4px; right: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
.tally { position: relative; }
.tally .bonus { position: absolute; right: 0; top: -7px; padding: 0 2px; background: var(--night); font: 600 .7rem/1 var(--mono); color: var(--gold); }
/* rail : pris partout mais un Patron la défausserait — les pastilles ne sont pas rouges, elles ne tuent pas */
.sym.taken.guarded .pips s { background: #6B5320; }
/* la vision de Nanna : la carte se soulève et montre sa face, sans être retournée */
#card.peek { transform: translateY(-12px) rotate(-2deg); transition: transform .2s; }
#card.peek .inner { transform: rotateY(180deg); }
#card.peek .face.front { visibility: visible; }
#card.peek .face.back { visibility: hidden; }

/* ---- accueil (D44) : le nom, ton ciel, ta progression, Jouer ; le panthéon et le Défi du jour en bas */
#app.home { grid-template-rows: 1fr; }
#app.home #head, #app.home #rail, #app.home #stage, #app.home #tray, #app.home #vestibule { display: none; }
#home { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; justify-items: center; gap: 18px; min-height: 0;
  padding-bottom: calc(var(--sab) + 18px); }
#home[hidden] { display: none; }
#home-sky { position: absolute; inset: 0 -12px auto; width: calc(100% + 24px); height: 62%; pointer-events: none; }
#home-settings { position: relative; justify-self: end; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--soft); }
#logo { position: relative; align-self: center; margin: 0; font: 300 1.55rem/1 var(--sans); letter-spacing: .42em; text-indent: .42em; color: var(--ivory); text-align: center; }
.h-prog { position: relative; display: grid; justify-items: center; gap: 8px; width: min(78%, 280px); }
#h-level { font: 500 .8rem var(--mono); letter-spacing: .12em; color: var(--gold); }
.h-xp { width: 100%; height: 2px; background: var(--line); border-radius: 1px; }
.h-xp i { display: block; height: 100%; width: 0; background: var(--gold); }
#h-next { margin: 0; text-align: center; color: var(--soft); font-size: .86rem; line-height: 1.35; }
#h-next b { color: var(--ivory); font-weight: 500; }
#home-play { position: relative; min-width: 190px; min-height: 64px; padding: 0 30px; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-dim); color: var(--gold);
  font: 500 .95rem var(--mono); letter-spacing: .34em; text-indent: .34em; text-transform: uppercase; }
.h-links { position: relative; display: flex; gap: 12px; align-items: stretch; }
.h-links button, .h-links .soon { min-height: 44px; min-width: 120px; padding: 6px 16px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(19, 24, 36, .7);
  display: grid; place-content: center; font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); text-align: center; }
.h-links .soon { border-style: dashed; color: var(--soft); }
.h-links .soon small { display: block; margin-top: 3px; font: 500 .7rem var(--sans); letter-spacing: 0; text-transform: none; color: var(--soft); }
/* la bulle d'un Gardien (D46) : on la demande en touchant sa plaque ; le jeu n'impose jamais de texte */
#tip { position: fixed; z-index: 15; left: 0; top: 0; max-width: min(280px, calc(100vw - 24px)); padding: 12px 14px; border: 1px solid var(--gold-soft); border-radius: 12px;
  background: #141A28; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); color: var(--ivory); font-size: .9rem; line-height: 1.4; }
#tip[hidden] { display: none; }
#tip b { display: block; margin-bottom: 4px; font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
#tip button { margin-top: 10px; min-height: 44px; padding: 0 16px; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-dim); color: var(--gold);
  font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; }

/* ---- vestibule : on y pose ses Gardiens avant la nuit ; Rejouer n'y repasse pas (D42) */
#app.vest { grid-template-rows: auto 1fr; }
#app.vest #rail, #app.vest #stage, #app.vest #tray { display: none; }
#vestibule { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; min-height: 0; padding-bottom: calc(var(--sab) + 12px); }
#vestibule[hidden] { display: none; }
.v-board { display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; column-gap: 8px; min-height: 0; }
.v-altar { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.v-niche { position: relative; min-height: 84px; border: 1px dashed var(--line-2); border-radius: 12px; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 2px; color: var(--soft); font: 500 .7rem/1.1 var(--sans); }
.v-niche .empty { width: 34px; height: 34px; border-radius: 50%; border: 1px dashed var(--line-2); }
.v-niche.filled { border-style: solid; border-color: var(--gold-soft); background: var(--gold-dim); color: var(--gold); }
.v-niche.target { border-color: var(--gold); border-style: solid; }
.v-niche.deny { animation: denyPulse .5s ease-out; }
.v-column { flex: 1; min-height: 60px; border: 1px dashed var(--line); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.v-column b { writing-mode: vertical-rl; font: 600 .7rem/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); }
.v-column span { font: 600 .7rem/1.2 var(--mono); letter-spacing: .04em; text-align: center; color: var(--soft); }
.v-center { display: grid; place-items: center; }
#play { max-width: 100%; min-height: 64px; padding: 0 18px; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold-dim); color: var(--gold); font: 500 .8rem var(--mono); letter-spacing: .24em; text-transform: uppercase; } /* « Commencer » tient entre les deux niches, jusqu'au petit écran */
.v-shelf { border-top: 1px solid var(--line); padding-top: 12px; }
/* cinq médaillons par rangée, deux rangées visibles ; au-delà, on fait défiler, et un fondu le dit */
#vgods { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 6px; max-height: 184px; padding-top: 6px; overflow-y: auto; touch-action: pan-y; } /* 6 px : le second filet d'un rang II ou III n'est pas rogné */
#vgods.more { -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent); mask-image: linear-gradient(180deg, #000 78%, transparent); }
.medal { width: 64px; min-height: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: none; touch-action: none; color: var(--ivory); }
.medal .disc { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--gold-soft); background: radial-gradient(60% 60% at 50% 40%, rgba(210, 162, 76, .16), rgba(19, 24, 36, .9)); display: grid; place-items: center; }
.medal .who { font: 500 .7rem/1.15 var(--sans); text-align: center; white-space: nowrap; }
.medal .who small { display: block; font: 500 .7rem var(--mono); color: var(--soft); }
.medal.sel .disc { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
.medal.placed .disc { border-style: dashed; opacity: .5; }
/* le rang d'un dieu (D48) : le cerclage s'épaissit — un filet au rang I, deux au rang II, deux et un halo au rang III (et
   au-delà : IV et V ne changent que le chiffre). Sur le médaillon, la niche et la plaque de la nuit. */
.medal.r2 .disc, .medal.r3 .disc, .v-niche.filled.r2, .v-niche.filled.r3, .plate.r2, .plate.r3 { outline: 1px solid var(--gold-soft); outline-offset: 2px; }
.medal.r3 .disc, .v-niche.filled.r3, .plate.r3 { box-shadow: 0 0 14px 2px rgba(210, 162, 76, .30); }
.medal.sel.r2 .disc, .medal.sel.r3 .disc { outline-color: var(--gold); }
.medal.sel.r2 .disc { box-shadow: none; }
.medal.placed .disc { outline-style: dashed; }
#vcaption { margin: 10px auto 0; max-width: 34ch; min-height: 2.8em; text-align: center; color: var(--soft); font-size: .88rem; line-height: 1.35; }
#vcaption b { color: var(--gold); font-weight: 500; }
#ghost { position: fixed; z-index: 30; left: 0; top: 0; pointer-events: none; }
#ghost[hidden] { display: none; }
/* le vestibule, à un geste : en retrait de Rejouer, qui reste l'action de la fin de nuit (D42) ; cible de 44 pt */
#end .alt { min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; background: none; justify-self: center; font: 500 .7rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--soft); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 5px; }
#end .saved { color: var(--ivory); }

/* ---- théophanie : le dieu nommé, plein écran, avant le décompte */
#theo { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 18px; background: #07090D; }
#theo[hidden] { display: none; }
#theo .plate { position: relative; width: min(62vw, 260px); aspect-ratio: 2 / 3; border: 1px solid var(--gold-soft); border-radius: 14px; overflow: hidden; background: linear-gradient(170deg, #10151F, #0A0D13); }
#theo .plate svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#theo .plate .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(210, 162, 76, .30), rgba(210, 162, 76, .04)); clip-path: inset(0 0 100% 0); }

/* ---- feuille : Panthéon, Stats, Réglages */
#sheet { position: fixed; inset: 0; z-index: 10; overflow-y: auto; touch-action: pan-y; background: var(--night); padding: calc(var(--sat) + 10px) 18px calc(var(--sab) + 28px); }
#sheet[hidden] { display: none; }
#sheet header { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
#sheet header #tabs { grid-column: 1 / -1; grid-row: 2; }
#to-home { justify-self: start; }
#to-home[hidden] { display: none; }

#sheet dt { color: var(--soft); }
#sheet dt small { display: block; font: .7rem var(--mono); color: var(--soft); }
#sheet dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
#sheet label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
#sheet label small { display: block; font-size: .78rem; color: var(--soft); }

#sheet button.danger { color: var(--danger); border-color: rgba(201, 87, 74, .5); }

/* panthéon : un ciel par tradition, dessiné en Canvas ; fiche au tap */
#trads { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
#trads button { min-height: 44px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: none; font: 500 .7rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
#trads button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }
#trads button.locked { color: var(--faint); border-style: dashed; }
#count { margin-left: auto; font: 500 .72rem var(--mono); letter-spacing: .08em; color: var(--soft); }
#sky { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #080A0F; touch-action: manipulation; }
#godcard { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); min-height: 108px; }
#godcard .who { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#godcard .who b { font: 500 1.2rem var(--sans); letter-spacing: .02em; }
#godcard.named .who b { color: var(--gold); }
#godcard .who span { font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
#godcard .sig { display: flex; gap: 6px; margin: 10px 0; }
#godcard .sig i { font: 600 .7rem var(--mono); font-style: normal; letter-spacing: .06em; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--soft); }
#godcard .sig i.on { border-color: var(--gold-soft); color: var(--gold); background: var(--gold-dim); }
#godcard p { margin: 0; color: var(--ivory); font-size: .92rem; line-height: 1.45; }
#godcard p.hint { color: var(--soft); }
#godcard p.attr { margin-top: 8px; color: var(--soft); font-size: .86rem; }
/* son pouvoir de Gardien, rang par rang (D48) : on ne le lit qu'une fois le dieu débloqué. Le rang atteint en or ; ceux
   d'avant ont un chiffre cerclé d'or, ceux à venir un chiffre en pointillé. */
#godcard .ranks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
#godcard .ranks li { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 10px; align-items: start; color: var(--soft); font-size: .88rem; line-height: 1.4; }
#godcard .ranks i { font: 600 .7rem/1 var(--mono); font-style: normal; letter-spacing: .04em; text-align: center; padding: 4px 0; margin-top: 1px; border: 1px dashed var(--line-2); border-radius: 6px; color: var(--soft); }
#godcard .ranks li.done i { border: 1px solid var(--gold-soft); color: var(--gold); }
#godcard .ranks li.now { color: var(--gold); }
#godcard .ranks li.now i { border: 1px solid var(--gold); background: var(--gold-dim); color: var(--gold); }
#godcard p.next { margin-top: 8px; color: var(--soft); font-size: .84rem; }

@media (prefers-reduced-motion: reduce) {
  #card, #card .inner, #xp i, .sym, .star, #passes span, .cue, .tally .mult { transition: none; }

  #card .face { transition: none !important; } /* les règles des faces sont plus spécifiques (#card.up .face.back) : sans !important leur délai de 170 ms survit */
}
</style>
</head>

<script>
// Le moteur de référence (engine/engine.js) est inliné ici tel quel par web/build.js,
// dans une portée de fonction : la page exécute exactement le fichier validé par npm test.
window.NoctuaireEngine = (function () {
  'use strict';
  const module = { exports: {} };
  
'use strict';
/**
 * NOCTUAIRE — moteur de règles de référence (v3 : deux autels, quatre axes, Patrons, XP).
 *
 * Ce fichier EST la spécification exécutable. Toute implémentation (web, Swift) doit
 * reproduire ses résultats sur engine/vectors.json. Aucune dépendance, aucun DOM.
 *
 * Vocabulaire code (le vocabulaire joueur est dans docs/SPEC-v3.md) :
 *  - card   : { dom: 0..7, ec: 1..6 }                (symbole, valeur)
 *  - altar  : { stars: [{dom, ec, ord}], taken: Set<dom>, patron: godName|null, flags }
 *  - action : 'T' | 'U' | 'L' | 'R' | 'D' | 'V'
 *      carte FACE CACHÉE : 'T' tirer (retourner, c'est l'engagement) · 'U' garder (clore la nuit)
 *                          'V' la vision de Nanna (voir la carte sans s'engager ; elle compte : au rang II, la carte
 *                          vue vaut double sur son autel, D48)
 *      carte FACE VISIBLE : 'L' poser à gauche · 'R' poser à droite · 'D' passer (coûte une passe)
 *    Règle cardinale (Flip 7) : on décide de continuer AVANT de voir la carte. Une carte retournée
 *    doit être posée ou passée ; si son symbole est pris sur tous les autels et qu'il ne reste
 *    aucune passe, elle fait tomber la nuit.
 */

// ---------------------------------------------------------------- données
const DOMS = ['CIEL', 'MER', 'TERRE', 'FEU', 'GUERRE', 'AMOUR', 'MORT', 'SAVOIR'];
const DOM_INDEX = Object.fromEntries(DOMS.map((d, i) => [d, i]));
const ECLATS = [1, 2, 3, 4, 5, 6];

const GODS = [
  ['Ishtar', 'Mésopotamie', ['AMOUR', 'GUERRE', 'CIEL']],
  ['Ereshkigal', 'Mésopotamie', ['MORT', 'TERRE', 'SAVOIR']],
  ['Enki', 'Mésopotamie', ['MER', 'SAVOIR', 'TERRE']],
  ['Nergal', 'Mésopotamie', ['MORT', 'GUERRE', 'FEU']],
  ['Nanna', 'Mésopotamie', ['CIEL', 'MER', 'SAVOIR']],
  ['Marduk', 'Mésopotamie', ['CIEL', 'GUERRE', 'SAVOIR']],
  ['Aphrodite', 'Grèce', ['AMOUR', 'MER', 'FEU']],
  ['Hadès', 'Grèce', ['MORT', 'TERRE', 'AMOUR']],
  ['Athéna', 'Grèce', ['GUERRE', 'SAVOIR', 'FEU']],
  ['Poséidon', 'Grèce', ['MER', 'TERRE', 'GUERRE']],
  ['Héphaïstos', 'Grèce', ['FEU', 'TERRE', 'SAVOIR']],
  ['Zeus', 'Grèce', ['CIEL', 'GUERRE', 'TERRE']],
  ['Taranis', 'Gaule', ['CIEL', 'FEU', 'GUERRE']],
  ['Epona', 'Gaule', ['TERRE', 'AMOUR', 'MER']],
  ['Cernunnos', 'Gaule', ['TERRE', 'MORT', 'FEU']],
  ['Lugus', 'Gaule', ['SAVOIR', 'FEU', 'CIEL']],
  ['Sucellos', 'Gaule', ['MORT', 'FEU', 'MER']],
  ['Belenos', 'Gaule', ['CIEL', 'AMOUR', 'MER']],
].map(([name, trad, sig]) => ({ name, trad, sig: sig.slice().sort().join('|'), sigArr: sig }));
const GOD_BY_NAME = Object.fromEntries(GODS.map(g => [g.name, g]));

// Pouvoirs des Patrons : un par dieu (D41), en trois rangs (D48). Le pouvoir s'applique à l'autel où son dieu est posé.
// `ranks[r - 1]` porte les paramètres du rang r et la phrase de la fiche (panthéon, préparation, bulle du Gardien). Le
// rang d'un Patron est le niveau de son dieu (I à V, +1 à chaque déblocage), plafonné à III : IV et V ne changent que
// l'apparence. À chaque rang, le même pouvoir grandit d'un cran, sans jamais rien retirer au rang d'avant. Chaque rang
// est mesuré et borné par `npm run check` : un gain réel, qui laisse le risque entier (D9, D48). Hermès, qui n'est pas au
// panthéon, a légué sa vision à Nanna.
const PATRONS = {
  // — Mésopotamie
  Ishtar: { kind: 'plus', ranks: [
    { doms: ['AMOUR', 'GUERRE'], plus: 1, text: 'AMOUR et GUERRE valent +1 sur son autel.' },
    { doms: ['AMOUR', 'GUERRE'], plus: 2, text: 'AMOUR et GUERRE valent +2 sur son autel.' },
    { doms: ['AMOUR', 'GUERRE', 'CIEL'], plus: 2, text: 'AMOUR, GUERRE et CIEL valent +2 sur son autel.' },
  ] },
  Ereshkigal: { kind: 'discardValue', ranks: [
    { per: 1, text: 'Chaque carte passée vaut 1 sur son autel.' },
    { per: 2, text: 'Chaque carte passée vaut 2 sur son autel.' },
    { per: 3, text: 'Chaque carte passée vaut 3 sur son autel.' },
  ] },
  Enki: { kind: 'plus', ranks: [

// hash53 : cyrb53 (Bryc), résultat 53 bits. On en garde les 32 bits bas comme graine.
function hash53(str) {

    h2 = Math.imul(h2 ^ c, 1597334677);

/**

      if (g && profile.gods[g] && E.PATRONS[g] && used < slots && !out.includes(g)) { out[i] = g; used++; }
    }
    return out;
  }

  // ---- nuit
  function freeSeed() { return 'libre|' + new Date().toISOString().slice(0, 10) + '|' + Math.random().toString(36).slice(2, 8); }
  /** Fin de nuit : Rejouer enchaîne avec les mêmes Patrons (D42) — sauf quand une place de Patron vient de s'ouvrir. */
  function replay() {
    if (applyUpdate()) return; // entre deux nuits : la version en ligne, si elle a changé
    if (state.last && state.last.slotOpened && !lessonFor({}, level())) { showVestibule(); return; }
    startNight();
  }
  function startNight(opts = {}) {
    const L = E.levelForXp(profile.xp);
    const lesson = lessonFor(opts, L); // avant que la graine imposée ne soit consommée
    closeTip();
    state.home = false; $('app').classList.remove('home'); $('home').hidden = true;
    state.vest = false; $('app').classList.remove('vest'); $('vestibule').hidden = true;
    let seed = opts.seed;
    if (!seed && state.seedOnce) { seed = state.seedOnce; state.seedOnce = null; } // graine imposée : une seule nuit
    // relance spontanée : le protocole de test veut savoir si Rejouer part de lui-même (< 10 s)
    if (state.endShownAt && profile.log.length) {
      const last = profile.log[profile.log.length - 1];
      if (last.replayMs == null) { last.replayMs = Math.round(performance.now() - state.endShownAt); saveProfile(); }
    }
    state.endShownAt = 0;
    const patrons = lesson ? [null, null] : activePatrons(L);
    state.night = E.start({ seed: seed || freeSeed(), altars: lesson ? LESSONS[lesson].altars : E.altarsForLevel(L), patrons, ranks: patrons.map(godLvl), level: L });
    state.last = null; state.tuto = null; state.tutoNext = null; state.busy = false;
    if (lesson) installLesson(state.night, lesson);
    card.style.transform = ''; card.style.opacity = ''; card.classList.remove('peek'); state.snapFace = true;
    state.tReady = performance.now();
    render();
    fitBoard(); // la plaque du Patron prend une rangée en tête des colonnes
  }
  /** Légal maintenant (moteur) et, pendant la leçon, demandé par la consigne. */
  function allowed(a) {
    const n = state.night;
    if (!n || n.over || !E.legalActions(n).includes(a)) return false;
    const st = tutoStep();
    return !st || st.expect.includes(a); // 'LR' : poser d'un côté ou de l'autre
  }
  // Pendant une animation, toute entrée est ignorée : jamais de file d'attente, sinon deux gestes rapides
  // poseraient une carte avant de l'avoir vue.
  function request(action) {

  async function perform(action) {
    const n = state.night;

    logDecision(action, n);
    const multBefore = n.altars.map((a) => E.mult(n, a.stars.length));
    const passesBefore = n.passes;
    const c0 = n.faceUp ? E.current(n) : null; // la carte jouée (le moteur passe aussitôt à la suivante)
    const r = E.act(n, action);
    if (state.tuto) state.tuto.step++;
    if (r.result) settle(r);
    try { await animate(action, r, multBefore, c0, passesBefore); } catch (e) { /* une animation interrompue ne bloque jamais le jeu */ }
    if (state.last && state.last.prog.named.length) { try { await theophany(state.last.prog.named); } catch (e) { /* idem */ } }
    render();
    for (const i of state.glow) glowPlate(i); // après le dernier rendu du geste : un rendu intermédiaire remplacerait la plaque
    state.glow.clear();
    state.tReady = performance.now();
    state.busy = false;
  }
  /** Le pouvoir d'un Patron vient d'agir : sa plaque s'allume. `state.glows` en garde la trace pour les tests. */
  function glowPlate(i) {
    state.glows.push(i);
    const p = document.querySelector(`.altar[data-altar="${i}"] .plate`);
    if (!p) return;
    p.classList.remove('glow'); void p.offsetWidth; p.classList.add('glow');
  }
  /** Une ligne par décision (SPEC §14) : ce qu'on cherche à mesurer, c'est l'hésitation face cachée. */
  function logDecision(action, n) {
    const remaining = n.deck.length - n.idx;
    profile.decisions.push({
      a: action,
      ms: state.tReady ? Math.round(performance.now() - state.tReady) : null, // temps de réflexion depuis que l'écran était prêt
      up: n.faceUp,                                                          // false = la décision qui compte (continuer ou garder)
      stars: n.altars.reduce((s, a) => s + a.stars.length, 0),
      passes: n.passes,
      danger: remaining > 0 ? +(E.dangerCount(n) / remaining).toFixed(3) : 0,
    });
    if (profile.decisions.length > 3000) profile.decisions.splice(0, profile.decisions.length - 3000);
  }
  function settle(r) {
    const n = state.night, res = r.result;
    const bustDom = res.kind === 'bust' ? E.current(n).dom : null; // la carte fautive est encore la carte courante
    // une leçon rejouée compte (D23), mais ne renforce pas un dieu déjà débloqué : sinon on monterait Zeus au rang III
    // en rejouant l'apprentissage deux fois (D48)
    const replayed = !!state.tuto && !!profile[LESSONS[state.tuto.lesson].done];
    const known = replayed ? [...new Set(res.gods.filter((g) => g && profile.gods[g]))] : [];
    const lvlBefore = Object.fromEntries(known.map((g) => [g, profile.gods[g].lvl]));
    const prog = E.applyResult(profile, res);
    for (const g of known) profile.gods[g].lvl = lvlBefore[g];
    profile.best = Math.max(profile.best || 0, res.score);
    profile.log.push({ d: new Date().toISOString(), seed: n.seed, kind: res.kind, stars: res.stars, score: res.score,
                       gods: res.gods.filter(Boolean), graze: prog.graze ? prog.graze.god : null, level: prog.before, asc: n.ascension, replayMs: null,
                       patrons: n.altars.map((a) => a.patron), ranks: n.altars.map((a) => (a.power ? a.power.rank : null)) }); // question 5 du protocole : le Gardien et son rang
    if (profile.log.length > 500) profile.log.splice(0, profile.log.length - 500);
    if (state.tuto) {
      const lesson = LESSONS[state.tuto.lesson];
      profile[lesson.done] = true;
      if (lesson.showNext) state.tutoNext = n.idx < n.deck.length ? n.deck[n.idx] : null;
    }
    saveProfile();
    const slotOpened = prog.unlocks.some((u) => E.patronSlotsForLevel(u.level) > E.patronSlotsForLevel(u.level - 1)); // niveaux 2 et 7
    state.last = { result: res, prog, bustDom, slotOpened, rendered: false, known };
  }

  // ---- son : provisoire, coupé par défaut. Six sons synthétisés (Web Audio), aucun fichier ; le contexte
  // audio naît au premier geste du joueur (règle iOS). Sera remplacé par une vraie direction sonore.
  const audio = (() => {
    let ctx = null, master = null;
    const rnd = () => Math.random() * 2 - 1; // bruit blanc : hors moteur, hors graine

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

      src.buffer = buf; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
      if (to !== freq) f.frequency.exponentialRampToValueAtTime(to, t + dur);

      src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + dur + .02);
    }
    const SOUNDS = {
      flip:  (t) => { noise(t, { dur: .04, gain: .22, freq: 1800, q: 1.2 }); tone(t, { freq: 180, to: 120, dur: .06, gain: .16 }); },
      place: (t, k = 0) => { noise(t, { dur: .02, gain: .28, type: 'lowpass', freq: 900 }); tone(t, { freq: 210 + 14 * k, to: 130 + 8 * k, type: 'triangle', dur: .16, gain: .34 }); },
      pass:  (t) => { noise(t, { dur: .22, gain: .15, freq: 1200, to: 500, q: .8 }); },
      keep:  (t) => { tone(t, { freq: 523.25, dur: .7, gain: .15 }); tone(t + .01, { freq: 784, dur: .55, gain: .07 }); tone(t, { freq: 261.6, dur: .5, gain: .1, type: 'triangle' }); },
      tier:  (t) => { noise(t, { dur: .03, gain: .18, type: 'lowpass', freq: 600 }); tone(t, { freq: 330, dur: 1, gain: .2 }); tone(t, { freq: 660, dur: .7, gain: .07 }); tone(t, { freq: 990.5, dur: .5, gain: .035 }); },
      theo:  (t) => { [523.25, 659.25, 783.99].forEach((f, i) => tone(t + i * .06, { freq: f, dur: 1.4 - i * .2, gain: .12 })); tone(t, { freq: 130.8, dur: 1.6, gain: .09, type: 'triangle' }); },
      bust:  (t) => { noise(t, { dur: .75, gain: .32, type: 'lowpass', freq: 320, to: 110 }); [0, .07, .16, .28].forEach((d, i) => tone(t + d, { freq: 130 - i * 12, to: 70, type: 'triangle', dur: .18, gain: .28 })); },
    };
    const played = []; // trace pour les tests
    function play(name, arg) { const c = ensure(); if (!c) return; try { SOUNDS[name](c.currentTime + .005, arg); played.push(name); } catch (e) { /* jamais bloquant */ } }
    return { play, unlock: ensure, played, get ctx() { return ctx; } };
  })();
  state.audio = audio;

  // ---- animations : tout est une propriété animée par le moteur du navigateur (Web Animations), rien d'importé
  function anim(el, frames, duration, easing = 'ease-out', fill = 'none') {
    const d = ms(duration);
    if (!d || !el || !el.animate) return Promise.resolve();
    const done = el.animate(frames, { duration: d, easing, fill }).finished.catch(() => {});
    return Promise.race([done, new Promise((r) => setTimeout(r, d + 200))]); // jamais bloqué par une animation qui ne finit pas (onglet en arrière-plan, élément retiré)
  }
  function haptic(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* pas de vibreur */ } }
  const currentTransform = () => card.style.transform || 'none';
  function springBack() { const from = currentTransform(); card.style.transform = ''; return anim(card, [{ transform: from }, { transform: 'none' }], 260, 'cubic-bezier(.2,.9,.3,1.15)'); }
  function refuse(dir) {
    if (dir === 'R' && !$('altar-locked').hidden) { // le second autel n'est pas encore ouvert : c'est lui qui le dit
      const lock = $('altar-locked');
      lock.classList.remove('deny'); void lock.offsetWidth; lock.classList.add('deny');
      setTimeout(() => lock.classList.remove('deny'), 600);
    }
    const from = currentTransform(); card.style.transform = '';
    anim(card, [{ transform: from }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-4px)' }, { transform: 'none' }], 320, 'ease-in-out');
    if (state.tuto) anim($('consigne'), [{ transform: 'scale(1)', color: 'var(--ivory)' }, { transform: 'scale(1.06)', color: 'var(--gold)', offset: .3 }, { transform: 'scale(1)', color: 'var(--ivory)' }], 520, 'ease-out');
    haptic(12);
  }
  function slotEl(altarIdx, k) { return document.querySelector(`.altar[data-altar="${altarIdx}"] .star:nth-child(${k + 1})`); }
  /** La carte part de sa position courante (déjà déplacée par le doigt) vers une place de l'autel, puis disparaît. */
  async function flyTo(target) {
    const from = currentTransform(); card.style.transform = ''; card.style.opacity = '0';
    const c = card.getBoundingClientRect(), t = target ? target.getBoundingClientRect() : c;
    const dx = t.left + t.width / 2 - (c.left + c.width / 2), dy = t.top + t.height / 2 - (c.top + c.height / 2), s = Math.max(.12, t.width / c.width);
    await anim(card, [{ transform: from, opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) scale(${s})`, opacity: .92 }], 300, 'cubic-bezier(.3,.7,.2,1)');
  }
  async function enterNext() { // la carte suivante arrive, face cachée
    state.snapFace = true; render();
    card.style.opacity = '';
    await anim(card, [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], 200);
  }
  /** Passer : la carte tombe dans la défausse, en bas — la destination du geste est visible. */
  async function passAnim() {
    const from = currentTransform(); card.style.transform = ''; card.style.opacity = '0';
    const c = card.getBoundingClientRect(), t = $('discard').getBoundingClientRect();
    const dx = t.left + t.width / 2 - (c.left + c.width / 2), dy = t.top + t.height / 2 - (c.top + c.height / 2);
    await anim(card, [{ transform: from, opacity: 1 }, { transform: `translate(${dx.toFixed(0)}px, ${dy.toFixed(0)}px) scale(${Math.max(.18, t.width / c.width).toFixed(2)}) rotate(8deg)`, opacity: .5 }], 320, 'cubic-bezier(.4,0,.8,.6)');
    anim($('discard'), [{ transform: 'scale(1)' }, { transform: 'scale(1.18)', offset: .4 }, { transform: 'scale(1)' }], 320);
  }
  async function keepAnim() {
    const from = currentTransform(); card.style.transform = ''; card.style.opacity = '0';
    await anim(card, [{ transform: from, opacity: 1 }, { transform: 'translateY(-40vh) scale(.9)', opacity: 0 }], 360, 'cubic-bezier(.3,.6,.2,1)');
  }
  async function bustSequence(altarIdx) {
    const n = state.night, a = n.altars[altarIdx];
    await flyTo(slotEl(altarIdx, a.stars.length)); // la carte s'abat sur la place suivante
    const altarEl = document.querySelector(`.altar[data-altar="${altarIdx}"]`);
    const cell = document.querySelector(`.sym[data-dom="${state.last.bustDom}"]`); if (cell) cell.classList.add('flash');
    audio.play('bust'); haptic([30, 40, 60]);
    await anim(altarEl, [{ transform: 'none' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(9px)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 380, 'ease-in-out');
    const stars = altarEl ? [...altarEl.querySelectorAll('.star.on')] : [];
    await Promise.all(stars.map((s, i) => anim(s, [{ transform: 'none', opacity: 1 }, { transform: `translateY(46px) rotate(${i % 2 ? 8 : -8}deg)`, opacity: 0 }], 420 + i * 40, 'cubic-bezier(.4,0,1,1)', 'forwards')));
  }
  /** Ereshkigal et Athéna : une carte part à la défausse, le total de leur autel bouge — leur plaque s'allume. */
  function glowPassPatrons() {
    state.night.altars.forEach((a, i) => { if (a.stars.length && ['discardValue', 'passValue'].includes(patronKind(a.patron))) state.glow.add(i); });
  }
  async function animate(action, r, multBefore, c0, passesBefore) {
    const n = state.night;
    if (action === 'T') { audio.play('flip'); render(); await wait(340); return; }
    if (action === 'D') { glowPassPatrons(); audio.play('pass'); await passAnim(); if (!n.over) await enterNext(); return; }
    if (action === 'U') { audio.play('keep'); await keepAnim(); return; }
    // poser
    if (r.event === 'bust') { await bustSequence(r.result.bustAltar); return; }
    const i = action === 'R' ? 1 : 0, a = n.altars[i];
    if (r.event === 'free-discard') { // Hadès, Poséidon, Epona : la carte tombe à la défausse, les passes restent
      state.glow.add(i); glowPassPatrons(); await passAnim(); if (!n.over) await enterNext(); return;
    }
    if (r.event === 'upgrade') {      // Lugus : la carte plus forte prend la place de l'étoile de son symbole
      state.glow.add(i); glowPassPatrons();
      await flyTo(slotEl(i, a.stars.findIndex((s) => s.dom === c0.dom)));

    }

    audio.play('place', a.stars.length - 1);
    // le Patron de cet autel vient-il d'agir ? une valeur relevée, une seconde FEU, une passe rendue
    const s = a.stars[a.stars.length - 1];
    const paired = n.altars.length > 1 && n.altars[1 - i].taken.has(s.dom);
    if (E.starValue(n, i, s) !== s.ec * (paired ? 2 : 1) || a.stars.filter((x) => x.dom === s.dom).length > 1) state.glow.add(i);
    if (n.passes > passesBefore) { state.glow.add(i); anim($('passes'), [{ transform: 'scale(1)' }, { transform: 'scale(1.25)', offset: .35 }, { transform: 'scale(1)' }], 460); } // Cernunnos
    if (n.over) return;
    await enterNext();
    if (E.mult(n, a.stars.length) !== multBefore[i]) { // le multiplicateur vient de changer : le sous-total pulse
      const sum = document.querySelector(`.altar[data-altar="${i}"] .sum`), mult = document.querySelector(`.altar[data-altar="${i}"] .mult`);
      anim(sum, [{ transform: 'scale(1)' }, { transform: 'scale(1.22)', color: 'var(--gold)', offset: .35 }, { transform: 'scale(1)' }], 460, 'ease-out');
      anim(mult, [{ transform: 'scale(1)' }, { transform: 'scale(1.3)', offset: .35 }, { transform: 'scale(1)' }], 460, 'ease-out');

    }
  }
  function countUp(el, to, duration) {
    const d = ms(duration);
    if (!d) { el.textContent = to; return; }
    const t0 = performance.now();
    (function step(t) { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
  }

  /** Théophanie : le ciel s'arrête, la constellation du dieu s'allume sous un voile d'or, son nom paraît,
   *  puis la plaque s'envole vers l'accès au panthéon. Tout est dessiné et animé en code. */
  async function theophany(names) {
    const theo = $('theo'), plate = theo.querySelector('.plate'), veil = theo.querySelector('.veil');
    for (const name of names) {
      const g = GOD_BY_NAME[name], f = FIGURES[name];
      // la figure est recadrée sur son propre englobant : elle occupe le cœur de la plaque
      const xs = f.pts.map((p) => p[0]), ys = f.pts.map((p) => p[1]);
      const w0 = Math.max(...xs) - Math.min(...xs), h0 = Math.max(...ys) - Math.min(...ys);
      const k = Math.min(62 / Math.max(w0, .001), 96 / Math.max(h0, .001));
      const ox = Math.min(...xs) + w0 / 2, oy = Math.min(...ys) + h0 / 2;
      const pts = f.pts.map(([px, py]) => [50 + (px - ox) * k, 72 + (py - oy) * k]);
      const lines = f.edges.map(([a, b]) => `<line x1="${pts[a][0].toFixed(1)}" y1="${pts[a][1].toFixed(1)}" x2="${pts[b][0].toFixed(1)}" y2="${pts[b][1].toFixed(1)}" stroke="#D2A24C" stroke-opacity=".45" stroke-width=".7"/>`).join('');
      const dots = pts.map((p, i) => {
        const sig = f.sig.includes(i);
        return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${sig ? 2.6 : 1.4}" fill="${sig ? '#F1ECDF' : 'rgba(241,236,223,.55)'}"/>` +
               (sig ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="#D2A24C" fill-opacity=".16"/>` : '');
      }).join('');
      $('theo-sky').innerHTML = lines + dots;
      $('theo-name').textContent = name.toUpperCase();
      $('theo-trad').textContent = g.trad + ' · ' + f.attr;
      theo.hidden = false;
      audio.play('theo'); haptic([12, 60, 24]);
      await wait(200);                                                        // le gel
      veil.style.clipPath = 'inset(0 0 100% 0)';
      await anim(veil, [{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)' }], 600, 'cubic-bezier(.3,.7,.2,1)', 'forwards');
      await Promise.all([
        anim($('theo-name'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], 420),
        anim(plate, [{ transform: 'scale(.98)' }, { transform: 'scale(1)' }], 420),
      ]);
      await wait(700);
      const m = $('menu').getBoundingClientRect(), p = plate.getBoundingClientRect();
      await anim(theo, [{ opacity: 1 }, { opacity: 0 }], 420, 'ease-in', 'forwards');
      await anim(plate, [{ transform: 'none' }, { transform: `translate(${(m.left + m.width / 2 - p.left - p.width / 2).toFixed(0)}px, ${(m.top + m.height / 2 - p.top - p.height / 2).toFixed(0)}px) scale(.06)` }], 420, 'cubic-bezier(.4,0,.7,.6)');
      theo.hidden = true; theo.style.opacity = ''; plate.style.transform = '';
      if (theo.getAnimations) theo.getAnimations().forEach((a) => a.cancel());
      if (plate.getAnimations) plate.getAnimations().forEach((a) => a.cancel());
    }
  }

  // ---- rendu
  /** La figure d'un dieu en SVG, recadrée sur son englobant : médaillons, niches et plaques. Les trois étoiles de sa
   *  signature sont les plus grosses, comme au panthéon. */
  function figureSVG(name, w, h, pad = 3) {
    const f = FIGURES[name];
    const xs = f.pts.map((p) => p[0]), ys = f.pts.map((p) => p[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), w0 = Math.max(...xs) - x0 || .001, h0 = Math.max(...ys) - y0 || .001;
    const k = Math.min((w - 2 * pad) / w0, (h - 2 * pad) / h0);
    const P = f.pts.map(([x, y]) => [w / 2 + (x - x0 - w0 / 2) * k, h / 2 + (y - y0 - h0 / 2) * k]);
    const lines = f.edges.map(([a, b]) => `<line x1="${P[a][0].toFixed(1)}" y1="${P[a][1].toFixed(1)}" x2="${P[b][0].toFixed(1)}" y2="${P[b][1].toFixed(1)}"/>`).join('');

  function renderHead() {
    const L = E.levelForXp(profile.xp), lo = E.xpForLevel(L), hi = E.xpForLevel(L + 1);

  function render() {
    renderHead();
    $('back').hidden = !state.vest; $('prog').hidden = !!state.vest; // préparation : « ‹ Accueil » à la place de la progression
    if (state.home) { renderHome(); return; }
    if (state.vest || !state.night) { renderVestibule(); return; }
    const n = state.night;
    const res = n.over && state.last ? state.last.result : null;

    stage.classList.toggle('over', !!n.over);

    // rail : ce qu'une carte de chaque symbole ferait, compte tenu des Patrons (Nergal prend une seconde FEU, Hadès,

    $('rail').innerHTML = E.DOMS.map((d, i) => {
      const blocked = n.altars.map((_, k) => !E.placeable(n, k, i));

      const guarded = all && !E.deadly(n, i);
      const onL = blocked[0], onR = n.altars.length > 1 && blocked[1];
      const half = !all && (onL ? ' half-l' : onR ? ' half-r' : '');
      const flash = bust && state.last.bustDom === i;
      const left = n.remaining[i];
      const pips = E.ECLATS.map((_, k) => `<s class="${k < left ? '' : 'gone'}"></s>`).join('');
      const etat = all ? (n.altars.length > 1 ? ', posé des deux côtés' : ', déjà posé') + (guarded ? ' : un Gardien la défausserait' : ' : chacune ferait tout tomber')
        : onL ? ', posé à l’Aube : le Crépuscule ferait une paire'
        : onR ? ', posé au Crépuscule : l’Aube ferait une paire' : '';
      const label = `${d}, ${left} carte${left > 1 ? 's' : ''} dans le paquet${etat}`;
      return `<div class="sym${all ? ' taken' : half}${guarded ? ' guarded' : ''}${flash ? ' flash' : ''}" data-dom="${i}" role="img" aria-label="${label}"><b>${SYM[i]}</b><i class="pips">${pips}</i></div>`;
    }).join('');

    const maxPasses = E.ASCENSIONS[n.ascension].passes;

    disc.textContent = passed ? String(passed) : '—';
    disc.classList.toggle('has', passed > 0);
    disc.setAttribute('aria-label', passed ? `Défausse, ${passed} carte${passed > 1 ? 's' : ''} passée${passed > 1 ? 's' : ''}` : 'Défausse, vide');

    const c = E.current(n), up = n.faceUp && !n.over;
    if (state.snapFace) card.classList.add('snap');
    card.classList.toggle('up', !!up); card.classList.toggle('down', !up);
    if (up && c) showFace(c);
    if (state.snapFace) { void card.offsetWidth; card.classList.remove('snap'); state.snapFace = false; }

    for (const a of ['U', 'L', 'R', 'D']) cues[a].hidden = !allowed(a);
    hint.hidden = false;
    hint.textContent = n.over ? '' : (!n.faceUp ? (allowed('T') ? 'Retourner' : '') : (allowed('D') ? 'Passer' : ''));

    const withPlates = n.altars.some((a) => a.patron);
    for (let i = 0; i < 2; i++) {
      const el = $('altar-' + i), a = n.altars[i];
      el.hidden = !a;
      if (!a) continue;
      const fell = bust && res.savedAltar !== i; // Taranis garde l'autre autel debout
      el.classList.toggle('ruin', bust && res.bustAltar === i);
      const big = new Set(a.stars.length >= 3 ? E.top3(a).map((s) => s.ord) : []);
      const m = E.mult(n, a.stars.length);
      const slots = Array.from({ length: E.DOMS.length }, (_, k) => {
        const th = n.thresholds.find(([at]) => at === k + 1);            // le palier est écrit sur la place qui le déclenche
        const reach = th && a.stars.length >= th[0] ? (m === th[1] ? ' current' : ' reached') : '';
        const mark = th ? `<span class="mark${reach}">×${th[1]}</span>` : '';
        const s = a.stars[k];
        if (!s) return `<div class="star">${mark}</div>`;
        const other = n.altars[1 - i];
        const paired = !!other && other.taken.has(s.dom);        // le même symbole de l'autre côté : la paire double
        const shown = E.starValue(n, i, s);                      // on affiche ce que l'étoile vaut vraiment (D38), Patron compris
        const boost = shown !== s.ec * (paired ? 2 : 1);         // le Patron de l'autel la fait valoir plus : un point d'or
        const cls = ['on', big.has(s.ord) ? 'big' : '', paired ? 'pair' : '', boost ? 'boost' : '', fell ? 'fallen' : ''].filter(Boolean).join(' ');
        return `<div class="star ${cls}"><b>${SYM[s.dom]}</b><i>${shown}</i>${mark}</div>`;
      }).join('');
      let plate = '';
      if (withPlates) {
        const P = a.power;
        if (!P) plate = '<div class="plate none" aria-hidden="true"></div>';
        else plate = `<button class="plate${ringClass(P.rank)}${P.kind === 'peek' && !E.peeksLeft(n) ? ' used' : ''}" data-plate="${i}" aria-label="Gardien : ${nameLvl(a.patron)}. Toucher pour lire son pouvoir">${figureSVG(a.patron, 40, 30)}</button>`;
      }
      const bonus = E.passBonus(n, i); // Ereshkigal, Athéna : ce que les passes ajoutent, compris dans le total
      el.innerHTML = plate + `<div class="stars">${slots}</div>` +
        `<div class="tally"><span class="sum">${fell ? 0 : E.altarScore(n, i)}</span>` +
        (bonus && !fell ? `<span class="bonus" aria-label="dont ${bonus} pour les passes">+${bonus}</span>` : '') +
        `<span class="mult${m > 1 ? ' up' : ''}" aria-label="multiplicateur ×${m}">×${m}</span></div>`;
    }
    $('altar-locked').hidden = n.altars.length > 1; // au niveau 1 et 2, la place du second autel est tenue

    const st = tutoStep();
    $('consigne').hidden = !st || n.over;
    if (st) $('consigne').textContent = st.text;

    const aid = $('aid');
    aid.hidden = !settings.aidButtons || n.over;
    aid.querySelectorAll('button').forEach((b) => { b.disabled = !allowed(b.dataset.a); });

    renderEnd();
  }
  /** La face de la carte : son symbole en entier, son code, sa valeur. */
  function showFace(c) {

    front.querySelector('.val').textContent = c.ec;

  }
  const FRACTION = { '1/2': 'la moitié', '2/3': 'les deux tiers', '1/3': 'le tiers', '1/4': 'le quart' };
  function renderEnd() {
    const end = $('end'), n = state.night;
    end.hidden = !n.over;
    if (!n.over || !state.last || state.last.rendered) return;
    state.last.rendered = true;
    const { result, prog, bustDom } = state.last;
    const gods = prog.named;
    const alt = E.patronSlotsForLevel(level()) > 0 ? '<button class="alt" id="to-vest">Gardiens</button>' : ''; // la préparation, à un geste
    // un palier franchi : ce qu'il ouvre vraiment, ou, s'il n'ouvre rien encore, le prochain (D47)
    const real = prog.unlocks.find((u) => UNLOCK_TEXT[u.level]), nx = nextUnlock(prog.after);
    const unlockBox = real ? `<div class="unlock"><em>Niveau ${real.level}</em><span>${UNLOCK_TEXT[real.level]}</span></div>`

    const known = state.last.known || []; // une leçon rejouée : le dieu revient, sans se renforcer
    const uniq = [...new Set(gods)].filter((g) => !known.includes(g));
    const fresh = uniq.filter((g) => profile.gods[g].lvl === 1), again = uniq.filter((g) => profile.gods[g].lvl > 1);
    const grown = again.filter((g) => profile.gods[g].lvl <= E.POWER_RANKS); // un rang II ou III : son pouvoir grandit (D48)
    const tail = (fresh.length ? `<div class="gods">${fresh.join(', ')}<small>débloqué${fresh.length > 1 ? 's' : ''}</small></div>` : '') +
      (again.length ? `<div class="gods">${again.map((g) => nameLvl(g)).join(', ')}<small>renforcé${again.length > 1 ? 's' : ''}</small></div>` : '') +
      grown.map((g) => `<div class="gain">${grown.length > 1 ? `<b>${nameLvl(g)}</b> · ` : ''}${E.power(g, godLvl(g)).text}</div>`).join('') +
      (known.length ? `<div class="gods">${known.join(', ')}<small>déjà débloqué${known.length > 1 ? 's' : ''}</small></div>` : '') +
      (prog.graze ? `<div class="graze">Nouvel indice au panthéon : <b>${E.DOMS[prog.graze.dom]}</b></div>` : '') + unlockBox;
    if (result.kind === 'bust') {

          ? `${patron} garde ${result.savedAltar === 0 ? 'l’Aube' : 'le Crépuscule'}${part ? ` et ${part} ${result.bustAltar === 0 ? 'de l’Aube' : 'du Crépuscule'}` : ''}`
          : `${patron} garde ${part}`;
        end.innerHTML = kicker + `<div class="score">0</div><div class="sub saved">${why}</div><div class="sub">+${result.score} XP</div>` + tail + `<div class="again">Rejouer</div>` + alt;
        countUp(end.querySelector('.score'), result.score, 600);

    } else {

      end.innerHTML = `<div class="kicker">Nuit gardée</div><div class="score">0</div>` +

        (state.tutoNext ? `<div class="sub">La carte suivante était ${E.DOMS[state.tutoNext.dom]} ${state.tutoNext.ec}.</div>` : '') +

  // ---- vestibule (D42) : les dieux nommés en médaillons, qu'on glisse sur la niche en tête d'un autel ; Jouer
  function showVestibule() {
    closeTip();
    state.home = false; $('app').classList.remove('home'); $('home').hidden = true;
    state.vest = true; state.vsel = null;
    $('app').classList.add('vest'); $('vestibule').hidden = false; $('end').hidden = true;
    render();
  }
  /** L'accueil (D44) : le nom, ton ciel, ta progression et ce qui arrive ensuite, Jouer. */
  function showHome() {
    closeTip();
    state.vest = false; $('app').classList.remove('vest'); $('vestibule').hidden = true;
    state.home = true; state.vsel = null;
    $('app').classList.add('home'); $('home').hidden = false; $('end').hidden = true;
    render();
  }
  function renderHome() {
    const L = level(), lo = E.xpForLevel(L), hi = E.xpForLevel(L + 1);
    $('h-level').textContent = 'Niveau ' + L;
    document.querySelector('.h-xp i').style.width = Math.round(100 * (profile.xp - lo) / (hi - lo)) + '%';
    const nx = nextUnlock(L);
    $('h-next').innerHTML = nx ? `Au niveau ${nx.level} : <b>${nx.text}</b>` : 'Tous les autels et tous les Gardiens sont ouverts.';
    drawHomeSky();
  }
  /** Le ciel de l'accueil : un semis fixe, et tes dieux débloqués en or pâle autour du nom. */
  function drawHomeSky() {
    const cv = $('home-sky'), w = cv.clientWidth || 360, h = cv.clientHeight || 400, dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const x = cv.getContext('2d');
    if (!x) return;
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    const r = E.rng(E.seed32('accueil'));
    for (let i = 0; i < 150; i++) {
      const px = r() * w, py = r() * h, rad = .3 + r() * .8, a = (.06 + r() * .36) * (1 - (py / h) * .7);
      x.beginPath(); x.arc(px, py, rad, 0, Math.PI * 2); x.fillStyle = `rgba(206, 218, 240, ${a.toFixed(3)})`; x.fill();
    }
    // une couronne autour du nom (qui tient le bas du ciel) : jamais sur le nom, jamais coupée par un bord
    const SPOTS = [[.5, .14], [.2, .2], [.8, .2], [.33, .4], [.67, .4], [.1, .52], [.9, .52], [.12, .83], [.88, .83]];
    const size = Math.min(w * .19, h * .2);
    const c = cv.getBoundingClientRect(), l = $('logo').getBoundingClientRect(); // le nom, mesuré : aucune figure ne le touche
    const logo = { x0: l.left - c.left - 10, x1: l.right - c.left + 10, y0: l.top - c.top - 10, y1: l.bottom - c.top + 10 };
    TRADS.flatMap((t) => SKY_ORDER[t]).filter((g) => profile.gods[g]).slice(0, SPOTS.length).forEach((g, i) => {
      const f = FIGURES[g];
      const cx = Math.min(Math.max(SPOTS[i][0] * w, size / 2 + 4), w - size / 2 - 4);
      let cy = Math.min(Math.max(SPOTS[i][1] * h, size / 2 + 4), h - size / 2 - 4);
      if (cx + size / 2 > logo.x0 && cx - size / 2 < logo.x1 && cy + size / 2 > logo.y0 && cy - size / 2 < logo.y1) {
        cy = cy < (logo.y0 + logo.y1) / 2 ? logo.y0 - size / 2 : Math.min(logo.y1 + size / 2, h - size / 2 - 4); // au-dessus ou au-dessous du nom
      }
      const pts = f.pts.map(([px, py]) => ({ x: cx + (px - .5) * size, y: cy + (py - .5) * size }));
      x.beginPath(); for (const [a, b] of f.edges) { x.moveTo(pts[a].x, pts[a].y); x.lineTo(pts[b].x, pts[b].y); }
      x.strokeStyle = 'rgba(210, 162, 76, .26)'; x.lineWidth = .8; x.stroke();
      pts.forEach((p, k) => { const sig = f.sig.includes(k); x.beginPath(); x.arc(p.x, p.y, sig ? 1.6 : .9, 0, Math.PI * 2); x.fillStyle = `rgba(241, 236, 223, ${sig ? .7 : .32})`; x.fill(); });
    });
  }
  $('home-play').addEventListener('click', () => { audio.unlock(); if (E.patronSlotsForLevel(level()) > 0) showVestibule(); else startNight(); });

  $('home-settings').addEventListener('click', () => { state.tab = 'reglages'; openSheet(); });
  $('back').addEventListener('click', () => showHome());
  function renderVestibule() {
    if (!state.vest) return;

    const named = TRADS.flatMap((t) => SKY_ORDER[t]).filter((g) => profile.gods[g] && E.PATRONS[g]);

      const col = document.querySelector(`.v-altar[data-altar="${i}"]`), name = i === 0 ? 'Aube' : 'Crépuscule';

    }

      return `<button class="medal${ringClass(lvl)}${placed ? ' placed' : ''}${state.vsel === g ? ' sel' : ''}" data-god="${g}" aria-label="${nameLvl(g, lvl)}${placed ? ', déjà sur un autel' : ''}">` +
        `<span class="disc">${figureSVG(g, 40, 36)}</span><span class="who">${g}${lvl > 1 ? `<small>${ROMAN[lvl]}</small>` : ''}</span></button>`;

  /** Poser un dieu sur la niche d'un autel : il quitte l'autre ; avec une seule place, il change d'autel. */
  function assign(god, i) {

    if (E.patronSlotsForLevel(L) < 2) p[1 - i] = null;

  function unassign(i) { const p = activePatrons(); p[i] = null; profile.patrons = p; saveProfile(); render(); }
  const ghost = $('ghost');
  let vd = null; // un médaillon qu'on glisse
  const nicheAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.v-niche'); };

  $('vgods').addEventListener('pointerdown', (e) => {

    }

  // ---- Nanna : voir la carte cachée, une fois par nuit, sans la retourner
  async function peekCard() {
    const n = state.night;
    if (!n || n.over || n.faceUp || state.busy || state.vest) return;
    const i = n.altars.findIndex((a) => patronKind(a.patron) === 'peek');
    const r = E.act(n, 'V'); // la vision compte : au rang II, la carte vue vaut double chez Nanna

  // ---- gestes : tap = retourner ; glisser gauche/droite = poser ; bas = passer ; haut = garder
  const THRESH = 72, TAP_MAX = 10, FLICK = .7;

  function setCue(a) { for (const k in cues) cues[k].classList.toggle('on', k === a); }

  function godState(name) {

    if ((E.TRAD_LEVEL[g.trad] || 1) > L) return { kind: 'locked', need: E.TRAD_LEVEL[g.trad] };

  /** Les points d'une figure, projetés dans un carré de côté `size` centré en (cx, cy). */
  function figureAt(name, cx, cy, size) {

  function drawSky() {
    const w = sky.clientWidth || 320, h = Math.round(Math.min(w * 1.25, Math.max(300, window.innerHeight * .52)));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    const r = E.rng(E.seed32('ciel|' + state.trad));
    const band = x.createLinearGradient(0, h, w, 0);
    band.addColorStop(0, 'rgba(36, 48, 78, 0)'); band.addColorStop(.42, 'rgba(44, 58, 92, .30)');

    }
    state.hits = []; state.starPoints = {};
    const size = PLACEMENT.size * w;
    SKY_ORDER[state.trad].forEach((name, i) => {
      const f = FIGURES[name], g = GOD_BY_NAME[name], st = godState(name);
      const cx = PLACEMENT.cols[i % 2] * w, cy = PLACEMENT.rows[Math.floor(i / 2)] * h;
      const pts = figureAt(name, cx, cy, size);
      const named = st.kind === 'named', locked = st.kind === 'locked';

        if (named && isSig >= 0) {
          const grd = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 5);
          grd.addColorStop(0, 'rgba(210, 162, 76, .38)'); grd.addColorStop(1, 'rgba(210, 162, 76, 0)');
          x.fillStyle = grd; x.beginPath(); x.arc(p.x, p.y, rad * 5, 0, Math.PI * 2); x.fill();

        x.fillStyle = locked ? 'rgba(150, 162, 182, .20)' : named ? '#F1ECDF' : `rgba(226, 232, 244, ${isSig >= 0 ? .62 : .34})`;

        x.fill();

          x.fillText(g.sigArr[isSig].slice(0, 2), p.x, p.y - rad - 5);
        }
      });

  function renderPantheon() {

  // ---- dimensions : la colonne d'autel et la carte se partagent la place réellement disponible
  function fitBoard() {
    const root = document.documentElement, stage = $('stage');
    const sw = stage.clientWidth, sh = $('well').clientHeight;
    if (sw <= 0 || sh <= 0) return;
    // huit places + la ligne de total (+ la plaque du Patron, 44 px et son intervalle) doivent tenir dans la scène
    const plate = state.night && state.night.altars.some((a) => a.patron) ? 50 : 0;

    root.style.setProperty('--altar-h', (slot * 8 + 7 * 3 + 46 + plate) + 'px'); // huit places + la ligne de total
    root.style.setProperty('--altar-w', Math.max(50, Math.min(62, Math.round(sw * .155))) + 'px');
    const w = well.clientWidth, h = well.clientHeight - 44; // moins la bande des repères Garder / Passer
    // w − 58 : de chaque côté, les paliers (≈ 10 px), le repère « Poser » (13 px) et deux marges de 3 px
    if (w > 0 && h > 0) root.style.setProperty('--card-w', Math.round(Math.max(100, Math.min(w * .74, w - 58, 200, h / 1.5))) + 'px');
  }
  const fitCard = fitBoard;
  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe($('stage')); else window.addEventListener('resize', fitBoard);
  window.addEventListener('resize', () => { fitBoard(); if (!sheet.hidden && state.tab === 'pantheon') drawSky(); });
  fitBoard();

  // ---- mise à jour : l'app de l'écran d'accueil reprend la page qu'elle a en mémoire, et GitHub Pages la garde en cache
  // dix minutes. Au lancement et à chaque retour au premier plan, on demande au serveur quelle version est en ligne ;
  // si elle a changé, on recharge — jamais au milieu d'une nuit : à la suivante.
  const VERSION = ((document.querySelector('meta[name="noctuaire-version"]') || {}).content || '').split(' ');
  state.version = { sha: VERSION[0] || '', date: VERSION[1] || '' };
  const assembled = /^[0-9a-f]{7,}$/.test(state.version.sha); // page servie par le serveur ou GitHub Pages, pas le fichier brut
  $('version').textContent = assembled
    ? `Version ${state.version.sha} · ${new Date(state.version.date).toLocaleString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`
    : 'Version de travail';
  let lastCheck = 0;
  async function checkUpdate(force) {
    if (!assembled || !window.fetch || (!force && performance.now() - lastCheck < 60000)) return;
    lastCheck = performance.now();
    try {
      const html = await (await fetch(location.pathname, { cache: 'no-store' })).text();
      const m = html.match(/<meta name="noctuaire-version" content="([0-9a-f]{7,}) /);
      if (m && m[1] !== state.version.sha) { state.updateTo = m[1]; applyUpdate(); }
    } catch (e) { /* hors ligne : on joue la version qu'on a */ }
  }
  /** Recharge sur la version en ligne si aucune nuit n'est engagée ; renvoie true si la page s'en va. */
  function applyUpdate() {
    const n = state.night;
    if (!state.updateTo || !sheet.hidden) return false;
    if (!(state.home || state.vest || !n || n.over || (n.idx === 0 && !n.faceUp))) return false; // une nuit en cours : à la suivante
    try { // jamais deux fois pour la même version : si le cache résiste, on ne tourne pas en rond
      if (sessionStorage.getItem('noctuaire.update') === state.updateTo) return false;
      sessionStorage.setItem('noctuaire.update', state.updateTo);
    } catch (e) { /* sans stockage de session, on tente une fois */ }
    location.replace(location.pathname + '?v=' + state.updateTo); // une adresse neuve : aucun cache ne la connaît
    return true;
  }
  state.checkUpdate = checkUpdate; // pour les tests
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  window.addEventListener('pageshow', (e) => { if (e.persisted) checkUpdate(true); });

  // ---- départ : la leçon due (sauf graine imposée) ; ?tuto=1 force la première, ?tuto=2 celle de la paire ;
  // puis l'accueil à chaque lancement (D44) ; Jouer mène à la préparation dès qu'un Gardien peut être posé
  const asked = { 1: 'first', 2: 'pair' }[params.get('tuto')] || null;
  if (!asked && !state.seedOnce && !lessonFor({}, level())) showHome();
  else startNight({ lesson: asked });
  checkUpdate(true);
})();
</script>
