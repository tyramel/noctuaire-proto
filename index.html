    const niche = e.target.closest('.v-niche');
    if (!niche) return;
    const i = +niche.dataset.altar, here = activePatrons()[i];
    if (state.vsel && state.vsel !== here) assign(state.vsel, i);             // un dieu choisi prend la place
    else if (here) { state.vsel = state.vsel === here ? null : here; render(); } // toucher un Gardien posé : lire son pouvoir
    else { niche.classList.remove('deny'); void niche.offsetWidth; niche.classList.add('deny'); } // rien de choisi : la niche attend un dieu
  });
  $('play').addEventListener('click', startFromVestibule);

  // ---- Nanna : voir la carte cachée, une fois par nuit, sans la retourner
  async function peekCard() {
    const n = state.night;
    if (!n || n.over || n.faceUp || state.busy || state.vest) return;
    const i = n.altars.findIndex((a) => patronKind(a.patron) === 'peek');
    const r = E.act(n, 'V'); // la vision compte : au rang II, la carte vue vaut double chez Nanna
    if (!r.ok) return;
    if (state.vnight && state.veillee) { state.veillee.actions.push('V'); saveVeillee(); }
    if (state.dnight && state.defi) { state.defi.actions.push('V'); saveDefi(); }
    state.note = null;
    const c = r.card;
    state.busy = true;
    showFace(c); card.classList.add('peek'); audio.sfx('vision'); say(`Vue : ${E.DOMS[c.dom]} ${c.ec}`);
    glowPlate(i);
    haptic(10);
    await new Promise((r) => setTimeout(r, 1400)); // le temps de lire : ce n'est pas une animation, « Réduire les animations » ne l'abrège pas
    card.classList.remove('peek');
    state.busy = false; state.tReady = performance.now();
    render();
  }
  // ---- la bulle d'un Gardien (D46) : toucher sa plaque la lit ; Nanna y offre sa vision. Le jeu n'impose jamais de
  // texte pendant la nuit, mais ce qu'on demande, on le lit.
  const tip = $('tip');
  function openTip(i) {
    const n = state.night, a = n && n.altars[i];
    if (!a || !a.patron) return;
    const g = a.patron, P = a.power; // le pouvoir de la nuit, à son rang
    const canPeek = P.kind === 'peek' && E.peeksLeft(n) > 0 && !n.faceUp && !n.over && !state.busy;
    tip.innerHTML = `<b>${powerIcon(g)}<span>${nameLvl(g, P.rank)} · ${i === 0 ? 'l’Aube' : 'le Crépuscule'}</span></b>${P.text}` +
      (P.kind === 'peek' ? (canPeek ? '<br><button id="tip-peek">Voir la carte</button>' : !E.peeksLeft(n) ? '<br><span class="msg">Vision prise pour cette nuit.</span>' : '') : '');
    tip.hidden = false; state.tipFor = i;
    const pr = document.querySelector(`.altar[data-altar="${i}"] .plate`).getBoundingClientRect(), tr = tip.getBoundingClientRect();
    const x = i === 0 ? pr.left : pr.right - tr.width;
    tip.style.transform = `translate(${Math.round(Math.max(12, Math.min(x, innerWidth - tr.width - 12)))}px, ${Math.round(pr.bottom + 8)}px)`;
  }
  function closeTip() { clearTimeout(state.tipTimer); state.tipAuto = false; if (!tip.hidden) { tip.hidden = true; state.tipFor = null; } }
  /** La première fois qu'un pouvoir agit, à son rang, sa bulle s'ouvre d'elle-même trois secondes : le point d'or, la passe
   *  rendue, la carte défaussée se lisent au moment où elles arrivent (panel du 28 septembre). Elle ne retient aucun geste. */
  function explainPower(glows) {
    const n = state.night;
    if (!n || n.over || state.tuto) return;
    for (const i of glows) {
      const a = n.altars[i], P = a && a.power;
      if (!P) continue;
      const seen = profile.powersSeen || (profile.powersSeen = {}), key = a.patron + ':' + P.rank;
      if (seen[key]) continue;
      seen[key] = true; saveProfile();
      openTip(i); state.tipAuto = true;
      state.tipTimer = setTimeout(() => { if (state.tipAuto) closeTip(); }, 3200);
      return; // une bulle à la fois
    }
  }
  $('stage').addEventListener('click', (e) => {
    const p = e.target.closest('button.plate');
    if (!p) return;
    const i = +p.dataset.plate;
    if (state.tipFor === i) closeTip(); else openTip(i);
  });
  tip.addEventListener('click', (e) => { if (e.target.closest('#tip-peek')) { closeTip(); peekCard(); } });
  document.addEventListener('pointerdown', (e) => { if (!tip.hidden && !e.target.closest('#tip, .plate, #stage')) closeTip(); });

  // ---- gestes : tap = retourner ; glisser gauche/droite = poser ; bas = passer ; haut = garder
  const THRESH = 72, TAP_MAX = 10, FLICK = .7;
  let g = null, ringTimer = null;
  const dirOf = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'L' : 'R') : (dy < 0 ? 'U' : 'D'));
  function setCue(a) { for (const k in cues) cues[k].classList.toggle('on', k === a); }
  function startRing() {
    const t0 = performance.now(); card.classList.add('ring');
    ringTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / 600);
      card.style.setProperty('--ring', (k * 360) + 'deg');
      if (k >= 1) { cancelRing(); g = null; request('U'); }
    }, 16);
  }
  function cancelRing() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } card.classList.remove('ring'); card.style.removeProperty('--ring'); }
  stage.addEventListener('pointerdown', (e) => {
    if (!state.night || state.night.over || e.button > 0 || e.target.closest('#aid, .plate')) return; // la plaque d'un Gardien n'est pas la carte
    // une bulle ouverte par le joueur : un toucher la ferme sans rien jouer (retourner engage) ; un glissement, lui, joue
    // en la fermant. Une bulle ouverte d'elle-même ne retient aucun geste (panel du 28 septembre).
    const guard = !tip.hidden && !state.tipAuto;
    if (!tip.hidden) closeTip();
    audio.unlock();
    g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), dx: 0, dy: 0, moved: false, guard };
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* pas de capture : le geste marche quand même */ }
    if (settings.holdRing && !state.busy && allowed('U') && !guard) startRing();
  });
  stage.addEventListener('pointermove', (e) => {
    if (!g || e.pointerId !== g.id) return;
    g.dx = e.clientX - g.x0; g.dy = e.clientY - g.y0;
    if (!g.moved && Math.hypot(g.dx, g.dy) > TAP_MAX) { g.moved = true; cancelRing(); }
    if (!g.moved || state.busy) return;
    const d = dirOf(g.dx, g.dy), ok = allowed(d), k = ok ? .95 : .25; // résistance quand le geste ne mène nulle part
    card.style.transform = `translate(${g.dx * k}px, ${g.dy * k}px) rotate(${g.dx * k * .05}deg)`;
    setCue(ok && Math.hypot(g.dx, g.dy) > THRESH ? d : null);
  });
  function release(e) {
    audio.unlock();
    const gg = g; g = null; cancelRing(); setCue(null);
    if (!gg || state.busy) { if (gg && gg.moved) springBack(); return; }
    const dist = Math.hypot(gg.dx, gg.dy), dt = Math.max(1, performance.now() - gg.t0);
    if (!gg.moved) { if (dt < 400 && !gg.guard) request('T'); return; } // tap
    const d = dirOf(gg.dx, gg.dy);
    if (dist >= THRESH || (dist > 36 && dist / dt > FLICK)) { if (allowed(d)) request(d); else refuse(d); return; }

  // toucher le panneau : Rejouer (ou la suite de la Veillée) ; « Gardiens » : le vestibule. Au clic, pas au relâcher : sinon le
  // clic qui suit le toucher tombe sur l'écran suivant (une Offrande choisie, « Rentrer » touché sans le vouloir)
  $('end').addEventListener('click', (e) => {

  });
  $('end').addEventListener('keydown', (e) => {
    const b = e.target.closest('#to-vest, #end-home');

  $('aid').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) request(b.dataset.a); });
  // les boutons de l'interface répondent d'un petit clic d'ébène (D53) ; les gestes de la nuit, eux, ont chacun leur son
  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('button, input[type="checkbox"]');
    if (b && !b.disabled && !b.closest('#aid') && b.id !== 'tip-peek') audio.sfx('bouton');
  }, true);

  // ---- clavier : secours d'accessibilité et outil des tests
  const KEYS = { ArrowLeft: 'L', ArrowRight: 'R', ArrowDown: 'D', ArrowUp: 'U', ' ': 'T', Enter: 'T' };
  window.addEventListener('keydown', (e) => {
    if (!sheet.hidden) { if (e.key === 'Escape') closeSheet(); return; }
    if (state.home) { if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest && e.target.closest('#home button:not(#home-play)')) return; e.preventDefault(); $('home-play').click(); } return; }
    if (state.vest) { if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest && e.target.closest('#vestibule button:not(#play), #head button')) return; e.preventDefault(); startFromVestibule(); } return; }
    if (state.inter) return; // entre deux nuits : les boutons de l'écran, au doigt ou au clavier
    closeTip();

    if (!(e.key in KEYS)) return;
    e.preventDefault(); audio.unlock();
    if (state.night.over) { if (KEYS[e.key] === 'T') endPrimary(); return; }
    request(KEYS[e.key]);
  });

  // ---- panthéon : trois ciels, six constellations chacun, dessinés en Canvas 2D sur un semis déterministe
  const sky = $('sky');
  /** État d'un dieu pour le joueur : nommé (avec son niveau), endormi, ou verrouillé par la tradition. */
  function godState(name) {
    const g = GOD_BY_NAME[name], L = E.levelForXp(profile.xp);
    if ((E.TRAD_LEVEL[g.trad] || 1) > L) return { kind: 'locked', need: E.TRAD_LEVEL[g.trad] };
    const st = profile.gods[name];
    if (st) return { kind: 'named', lvl: st.lvl, best: st.best };
    return { kind: 'asleep', revealed: profile.revealed[name] || [] };
  }
  /** Les points d'une figure, projetés dans un carré de côté `size` centré en (cx, cy). */
  function figureAt(name, cx, cy, size) {
    const f = FIGURES[name];
    return f.pts.map(([x, y]) => ({ x: cx + (x - .5) * size, y: cy + (y - .5) * size }));
  }
  // les attributs pâles d'Astra sous les constellations nommées : le carré 1000 × 1000 de chacun porte aussi les étoiles du jeu
  const attrImgs = new Map();
  function attrImage(name, color) {
    const key = name + color;
    if (!attrImgs.has(key)) {
      const im = new Image();
      im.onload = () => { if (!sheet.hidden && state.tab === 'pantheon') drawSky(); };
      im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ATTRS[name].replace(/currentColor/g, color));
      attrImgs.set(key, im);
    }
    return attrImgs.get(key);
  }
  const tradLocked = (t) => (E.TRAD_LEVEL[t] || 1) > level();
  /** Le ciel d'une tradition (D56). Une tradition fermée : le ciel seul, sans silhouette (Astra) ; un dieu choisi : sa constellation
   *  seule, en grand, au-dessus de sa fiche ; sinon les six, à leur place. */
  function drawSky() {
    if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => { if (!sheet.hidden) drawSky(); }); // les noms en Inter
    const locked = tradLocked(state.trad), focus = !!state.selected && !locked;
    const w = sky.clientWidth || 320, h = focus ? 158 : Math.round(Math.min(w * 1.25, Math.max(300, window.innerHeight * .52)));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    sky.style.height = h + 'px'; sky.width = Math.round(w * dpr); sky.height = Math.round(h * dpr);
    for (const [id, plan] of [['sky-far', 'lointain'], ['sky-near', 'proche']]) {
      const src = `assets/ciels/${slug(state.trad)}-${plan}.png`;
      if ($(id).getAttribute('src') !== src) $(id).setAttribute('src', src);
    }
    state.hits = []; state.starPoints = {};
    const x = sky.getContext('2d');
    if (!x) return;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);
    if (locked) return;
    const size = focus ? Math.min(h - 40, w * .62) : PLACEMENT.size * w;
    (focus ? [state.selected] : SKY_ORDER[state.trad]).forEach((name, i) => {
      const f = FIGURES[name], g = GOD_BY_NAME[name], st = godState(name);
      const cx = focus ? w / 2 : PLACEMENT.cols[i % 2] * w, cy = focus ? h / 2 - 10 : PLACEMENT.rows[Math.floor(i / 2)] * h;
      const pts = figureAt(name, cx, cy, size);
      const named = st.kind === 'named';
      if (named) { // l'attribut, pâle, sous les étoiles : la constellation dessine le foudre, la roue, les bois de cerf
        const im = attrImage(name, '#C8B88C');
        if (im.complete && im.naturalWidth) { x.save(); x.globalAlpha = focus ? .4 : .28; x.drawImage(im, cx - size / 2, cy - size / 2, size, size); x.restore(); }
      }

      sessionStorage.setItem('noctuaire.update', state.updateTo);
    } catch (e) { /* sans stockage de session, on tente une fois */ }
    location.replace(location.pathname + '?v=' + state.updateTo); // une adresse neuve : aucun cache ne la connaît
    return true;
  }
  state.checkUpdate = checkUpdate; // pour les tests
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  window.addEventListener('pageshow', (e) => { if (e.persisted) checkUpdate(true); });

  // ---- départ : la leçon due (sauf graine imposée) ; ?tuto=1 force la première, ?tuto=2 celle de la paire ;
  // puis l'accueil à chaque lancement (D44) ; Jouer mène à la préparation dès qu'un Gardien peut être posé
  const asked = { 1: 'first', 2: 'pair' }[params.get('tuto')] || null;
  if (!asked && !state.seedOnce && !lessonFor({}, level())) showHome();
  else startNight({ lesson: asked });
  checkUpdate(true);
})();
</script>
</body>
</html>
